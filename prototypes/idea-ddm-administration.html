<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototype IDEA DDM Administration với dữ liệu minh họa.">
  <title>IDEA DDM Administration</title>
  <style>
    :root {
      --navy: #13233d;
      --navy-2: #203b5c;
      --blue: #166fbd;
      --blue-soft: #e8f3fc;
      --ink: #172638;
      --muted: #60748a;
      --line: #d7e0e9;
      --line-strong: #bccbd9;
      --canvas: #edf2f6;
      --surface: #ffffff;
      --soft: #f6f8fa;
      --green: #176b46;
      --green-bg: #e9f6ef;
      --amber: #845b16;
      --amber-bg: #fff5df;
      --red: #993b3b;
      --red-bg: #fff0f0;
      --focus: #f0a000;
      --sans: "Segoe UI", Arial, sans-serif;
      --mono: "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font: 13px/1.4 var(--sans);
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .icon { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .mono { font-family: var(--mono); font-size: 11px; }

    .app { height: 100vh; display: grid; grid-template-rows: 55px 32px 1fr 27px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 18px; color: #fff; background: var(--navy); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand img { width: 32px; height: 32px; object-fit: contain; border-radius: 5px; background: #fff; }
    .brand strong { display: block; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
    .brand small { display: block; margin-top: 1px; color: #b5c8dc; font-size: 10px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .demo-label { color: #c5d4e3; font-size: 11px; }
    .actor-select { height: 32px; min-width: 265px; padding: 0 30px 0 9px; color: #fff; background: var(--navy-2); border: 1px solid #58718d; border-radius: 3px; }
    .actor-select option { color: var(--ink); background: #fff; }

    .menubar { display: flex; align-items: center; gap: 3px; padding: 0 18px; color: #3d536a; background: #f8fafc; border-bottom: 1px solid var(--line); }
    .menu-label { height: 27px; display: inline-flex; align-items: center; padding: 0 9px; border: 0; background: transparent; font-size: 12px; }
    .menu-label:hover { color: var(--navy); background: #e7eef5; }
    .menu-spacer { flex: 1; }
    .surface-label { color: #728399; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

    .workspace { min-height: 0; display: grid; grid-template-columns: 238px minmax(620px, 1fr) 306px; }
    .rail, .main, .inspector { min-width: 0; min-height: 0; background: var(--surface); }
    .rail { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
    .rail-head { padding: 13px 13px 10px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: #6a7c90; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .rail-head strong { display: block; margin-top: 4px; color: var(--navy); }
    .rail-head small { display: block; margin-top: 2px; color: var(--muted); }
    .rail-scroll { min-height: 0; overflow: auto; padding: 9px 7px 14px; }
    .rail-section-title { padding: 6px 8px 4px; color: #75869a; font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .nav-item { width: 100%; min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 6px 9px; border: 0; border-radius: 3px; background: transparent; color: #38516a; text-align: left; }
    .nav-item:hover { color: #0d5d9f; background: #eef5fb; }
    .nav-item.active { color: #0b5d9f; background: #e2effa; box-shadow: inset 3px 0 0 var(--blue); font-weight: 700; }
    .nav-item .icon { color: #6c8399; }
    .nav-item.active .icon { color: var(--blue); }
    .nav-badge { margin-left: auto; min-width: 18px; padding: 1px 5px; border-radius: 9px; color: #5e7388; background: #e8eef4; font-size: 10px; text-align: center; }
    .rail-note { margin-top: auto; padding: 10px 12px; color: #64768a; background: #f8fafc; border-top: 1px solid var(--line); font-size: 11px; }

    .main { display: flex; flex-direction: column; background: #f4f7fa; }
    .main-head { flex: 0 0 auto; min-height: 74px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
    .crumbs { color: #718397; font-size: 10px; }
    .main-head h1 { margin: 4px 0 0; color: var(--navy); font-size: 20px; line-height: 1.15; }
    .main-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .head-actions { display: flex; align-items: center; gap: 7px; }
    .button { min-height: 31px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 3px; color: #3c566f; background: #fff; font-weight: 600; }
    .button:hover:not(:disabled) { color: #0c5e9f; background: #f0f7fc; border-color: #8eb4d3; }
    .button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .button.primary:hover:not(:disabled) { color: #fff; background: #0f5e9f; }
    .button.danger { color: var(--red); border-color: #dbb2b2; }
    .button.subtle { background: #f7f9fb; }
    .button.small { min-height: 27px; padding: 0 8px; font-size: 11px; }

    .content-scroll { min-height: 0; overflow: auto; padding: 12px 14px 18px; }
    .toolbar { min-height: 45px; display: flex; align-items: end; gap: 8px; padding: 8px 10px; background: #fff; border: 1px solid var(--line); border-bottom: 0; border-radius: 4px 4px 0 0; }
    .field { min-width: 145px; }
    .field.grow { flex: 1; min-width: 180px; }
    .field label { display: block; margin-bottom: 3px; color: #687b90; font-size: 10px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; height: 30px; padding: 0 8px; color: var(--ink); background: #fff; border: 1px solid var(--line-strong); border-radius: 3px; }
    .field textarea { height: 72px; padding: 7px 8px; resize: vertical; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .toolbar + .panel { border-radius: 0 0 4px 4px; }
    .panel-head { min-height: 39px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; color: var(--navy); background: #f8fafc; border-bottom: 1px solid var(--line); }
    .panel-head h2, .panel-head h3 { margin: 0; font-size: 12px; }
    .panel-head small { color: #708297; }
    .table-scroll { max-width: 100%; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { position: sticky; top: 0; z-index: 1; height: 32px; padding: 0 8px; color: #5e7288; background: #f2f5f8; border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 750; letter-spacing: .035em; text-align: left; text-transform: uppercase; white-space: nowrap; }
    td { height: 42px; padding: 6px 8px; color: #304960; border-bottom: 1px solid #e9eef3; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr[data-selectable] { cursor: pointer; }
    tbody tr[data-selectable]:hover { background: #f6faff; }
    tbody tr.selected { background: #eaf4fc; box-shadow: inset 3px 0 0 var(--blue); }
    .matrix th:not(:first-child), .matrix td:not(:first-child) { min-width: 82px; text-align: center; }
    .matrix th:first-child, .matrix td:first-child { min-width: 150px; text-align: left; }
    .matrix input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); }
    .item-title strong { display: block; color: #183a58; font-size: 12px; }
    .item-title small { display: block; margin-top: 1px; color: #718397; font-size: 10px; }
    .status { display: inline-flex; align-items: center; gap: 5px; min-height: 21px; padding: 0 7px; border: 1px solid transparent; border-radius: 11px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.green { color: var(--green); background: var(--green-bg); border-color: #c5e5d3; }
    .status.amber { color: var(--amber); background: var(--amber-bg); border-color: #ead39b; }
    .status.gray { color: #65788c; background: #f2f5f7; border-color: #dce3ea; }
    .status.blue { color: #145f9e; background: var(--blue-soft); border-color: #c2def3; }
    .split { display: grid; grid-template-columns: minmax(220px, .42fr) minmax(420px, 1fr); gap: 11px; }
    .list-button { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px; border: 0; border-bottom: 1px solid #e9eef3; background: #fff; text-align: left; }
    .list-button:hover, .list-button.active { background: #eaf4fc; }
    .list-button.active { box-shadow: inset 3px 0 0 var(--blue); }
    .list-button strong { display: block; color: #24435f; font-size: 11px; }
    .list-button small { display: block; color: #74869a; font-size: 10px; }
    .empty { padding: 34px 18px; color: #6c7f93; text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: #3c566f; }

    .draftbar { min-height: 47px; display: flex; align-items: center; gap: 10px; margin-top: 9px; padding: 7px 10px; background: #fff; border: 1px solid var(--line); border-radius: 4px; }
    .draftbar strong { color: var(--navy); }
    .draftbar small { color: #687b90; }
    .draftbar .actions { display: flex; gap: 7px; margin-left: auto; }
    .change-count { min-width: 23px; height: 22px; display: inline-grid; place-items: center; border-radius: 11px; color: #fff; background: var(--blue); font: 700 11px var(--mono); }
    .permission-result { padding: 18px; }
    .decision { display: flex; align-items: start; gap: 11px; padding: 13px; border: 1px solid #bfe0cf; background: var(--green-bg); }
    .decision.denied { border-color: #e1bbbb; background: var(--red-bg); }
    .decision-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--green); }
    .decision.denied .decision-icon { background: var(--red); }
    .decision strong { display: block; color: #183f2d; }
    .decision.denied strong { color: #743333; }
    .decision p { margin: 4px 0 0; color: #4f665b; }
    .decision.denied p { color: #725050; }
    .source-list { margin-top: 12px; border: 1px solid var(--line); }
    .source-row { display: grid; grid-template-columns: 150px 1fr; padding: 8px 10px; border-bottom: 1px solid #e9eef3; }
    .source-row:last-child { border-bottom: 0; }
    .source-row span:first-child { color: #6c7f93; }
    .source-row strong { color: #294861; }

    .inspector { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
    .inspector-head { padding: 13px 12px 10px; border-bottom: 1px solid var(--line); }
    .inspector-head h2 { margin: 4px 0 0; color: var(--navy); font-size: 14px; }
    .inspector-head p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .inspector-scroll { min-height: 0; overflow: auto; padding: 10px; }
    .info-section { margin-bottom: 10px; border: 1px solid var(--line); }
    .info-section h3 { margin: 0; padding: 8px 9px; color: #3a5670; background: #f6f8fa; border-bottom: 1px solid var(--line); font-size: 11px; }
    .info-body { padding: 9px; }
    .kv { display: grid; grid-template-columns: 105px 1fr; gap: 6px; padding: 5px 0; border-bottom: 1px solid #edf1f4; }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: #718397; font-size: 10px; }
    .kv strong { color: #294761; font-size: 10px; overflow-wrap: anywhere; }
    .note { padding: 9px; color: #536a7f; background: #f3f7fa; border-left: 3px solid #6b9fc7; font-size: 11px; }
    .note.warning { color: #75521e; background: var(--amber-bg); border-left-color: #d19a32; }

    .statusbar { display: flex; align-items: center; gap: 12px; padding: 0 11px; color: #5f7287; background: #f7f9fb; border-top: 1px solid var(--line); font-size: 10px; }
    .statusbar span:last-child { margin-left: auto; }
    .status-light { width: 7px; height: 7px; border-radius: 50%; background: #2b9662; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(12, 27, 44, .48); }
    .modal { width: min(560px, 100%); max-height: min(690px, calc(100vh - 36px)); overflow: auto; background: #fff; border: 1px solid #9caec0; box-shadow: 0 18px 48px rgba(10, 28, 48, .26); }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; color: var(--navy); font-size: 16px; }
    .modal-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .icon-button { width: 31px; height: 31px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); background: #fff; }
    .modal-body { padding: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .form-grid .field { min-width: 0; }
    .form-grid .field.full { grid-column: 1 / -1; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 7px; padding: 10px 14px; background: #f7f9fb; border-top: 1px solid var(--line); }
    .change-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); }
    .change-list li { display: grid; grid-template-columns: 140px 1fr; gap: 8px; padding: 8px 9px; border-bottom: 1px solid #e9eef3; }
    .change-list li:last-child { border-bottom: 0; }
    .change-list span { color: #667a8f; }
    .toast { position: fixed; right: 17px; bottom: 42px; z-index: 120; max-width: 390px; padding: 10px 12px; color: #fff; background: #17334e; border-left: 4px solid #4ea1df; box-shadow: 0 8px 24px rgba(12, 29, 47, .22); }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 210px minmax(560px, 1fr); }
      .inspector { display: none; }
    }
    @media (max-width: 780px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-rows: auto auto 1fr auto; }
      .topbar { align-items: flex-start; padding: 10px 12px; }
      .top-actions { align-items: flex-end; flex-direction: column; }
      .actor-select { min-width: 225px; }
      .workspace { display: block; }
      .rail { border-right: 0; border-bottom: 1px solid var(--line); }
      .rail-scroll { display: flex; gap: 4px; overflow-x: auto; }
      .rail-section-title, .rail-note { display: none; }
      .nav-item { width: auto; min-width: max-content; }
      .main { min-height: 720px; }
      .main-head { align-items: flex-start; flex-direction: column; }
      .split, .form-grid { grid-template-columns: 1fr; }
      .form-grid .field.full { grid-column: auto; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .draftbar { align-items: flex-start; flex-direction: column; }
      .draftbar .actions { margin-left: 0; flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <svg class="sr-only" aria-hidden="true">
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3-7 8-7s8 3 8 7"></path></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2c0-3-2-5-5-5H6c-3 0-5 2-5 5v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M18 8a4 4 0 0 1 0 7M22 21v-2c0-2-1-4-3-5"></path></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-5"></path></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M17 6l3 3M14 9l3 3"></path></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="16" width="7" height="5" rx="1"></rect><path d="M10 5h4a4 4 0 0 1 4 4v7M14 18h-4a4 4 0 0 1-4-4V8"></path></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"></path><path d="M14 2v5h5M9 12h6M9 16h6"></path></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-7M3 3v6h6"></path><path d="M12 7v6l4 2"></path></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7h.01"></path></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v6h-6M4 18v-6h6"></path><path d="M6.5 8a7 7 0 0 1 11-2l2.5 6M17.5 16a7 7 0 0 1-11 2L4 12"></path></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="../logo-idea.png" alt="IDEA">
        <span><strong>IDEA DDM Administration</strong><small>Quản trị hệ thống tài liệu kỹ thuật</small></span>
      </div>
      <div class="top-actions">
        <span class="demo-label">Mô phỏng quyền · môi trường phát triển</span>
        <label><span class="sr-only">Chọn người quản trị</span><select class="actor-select" id="actor-select">
          <option value="pdm">Nguyễn Huỳnh Phúc Lâm · Quản trị PDM</option>
          <option value="account">Quản trị viên QLHT · Quản trị người dùng và phân quyền</option>
        </select></label>
      </div>
    </header>

    <div class="menubar" aria-label="Ngữ cảnh ứng dụng">
      <span class="surface-label">Hệ thống / Quản trị</span>
      <span class="menu-spacer"></span>
      <span class="surface-label">Prototype · dữ liệu không lưu</span>
    </div>

    <div class="workspace">
      <aside class="rail" aria-label="Chức năng quản trị">
        <div class="rail-head"><span class="eyebrow">Quyền đang dùng</span><strong id="rail-role"></strong><small id="rail-person"></small></div>
        <div class="rail-scroll" id="navigation"></div>
        <div class="rail-note" id="rail-note"></div>
      </aside>

      <main class="main" id="main-content" tabindex="-1">
        <header class="main-head">
          <div><div class="crumbs">Quản trị / <span id="crumb-current"></span></div><h1 id="page-title"></h1><p id="page-subtitle"></p></div>
          <div class="head-actions" id="head-actions"></div>
        </header>
        <div class="content-scroll" id="content"></div>
      </main>

      <aside class="inspector" aria-label="Chi tiết">
        <div class="inspector-head"><span class="eyebrow">Chi tiết</span><h2 id="inspector-title"></h2><p id="inspector-subtitle"></p></div>
        <div class="inspector-scroll" id="inspector-content"></div>
      </aside>
    </div>

    <footer class="statusbar"><span class="status-light" aria-hidden="true"></span><span>Kết nối mô phỏng</span><span id="policy-status"></span><span>IDEA DDM Administration</span></footer>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-head"><div><h2 id="modal-title"></h2><p id="modal-subtitle"></p></div><button class="icon-button" type="button" data-close-modal aria-label="Đóng"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button></header>
      <div class="modal-body" id="modal-body"></div>
      <div id="modal-error" role="alert" hidden style="margin:0 14px 12px;padding:8px 10px;color:var(--red);background:var(--red-bg);border-left:3px solid var(--red)"></div>
      <footer class="modal-foot" id="modal-foot"></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const icon = (name) => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const clone = (value) => JSON.parse(JSON.stringify(value));

    const actors = {
      pdm: { userId:'USR-001', name:'Nguyễn Huỳnh Phúc Lâm', role:'Quản trị PDM', note:'Định nghĩa bộ quyền, loại tài liệu và workflow. Không tạo tài khoản hoặc tự thêm người vào nhóm.' },
      account: { userId:'USR-005', name:'Quản trị viên QLHT', role:'Quản trị người dùng và phân quyền', note:'Tạo người dùng, cấp tài khoản, quản lý nhóm và gán người vào nhóm. Không sửa ma trận quyền, workflow, duyệt hoặc phát hành.' }
    };
    const users = [
      {id:'USR-001', name:'Nguyễn Huỳnh Phúc Lâm', department:'Phát triển sản phẩm nội bộ', status:'Đang dùng'},
      {id:'USR-002', name:'Linh Nguyễn', department:'Thiết kế cơ khí', status:'Đang dùng'},
      {id:'USR-003', name:'Minh Trần', department:'Kiểm tra kỹ thuật', status:'Đang dùng'},
      {id:'USR-004', name:'Hana Sato', department:'Chất lượng', status:'Đang dùng'},
      {id:'USR-005', name:'Quản trị viên QLHT', department:'Phòng Quản lý hệ thống', status:'Đang dùng'},
      {id:'USR-006', name:'Sora Ito', department:'Sản xuất', status:'Đang dùng'}
    ];
    const accounts = [
      {id:'phuc.lam', userId:'USR-001', method:'Tài khoản IDEA', status:'Hoạt động', last:'09/09/2026 08:22'},
      {id:'linh.nguyen', userId:'USR-002', method:'Tài khoản IDEA', status:'Hoạt động', last:'09/09/2026 08:12'},
      {id:'minh.tran', userId:'USR-003', method:'Tài khoản IDEA', status:'Hoạt động', last:'09/09/2026 07:54'},
      {id:'hana.sato', userId:'USR-004', method:'Tài khoản IDEA', status:'Hoạt động', last:'08/09/2026 16:41'},
      {id:'qlht.admin', userId:'USR-005', method:'Tài khoản IDEA', status:'Hoạt động', last:'09/09/2026 08:02'},
      {id:'sora.ito', userId:'USR-006', method:'Tài khoản IDEA', status:'Đã khóa', last:'02/09/2026 13:15'}
    ];
    const groups = [
      {id:'design', name:'Kỹ sư thiết kế', type:'Nhóm quyền', policyGroup:true, status:'Đang dùng', members:['USR-002'], description:'Soạn và cập nhật tài liệu kỹ thuật.'},
      {id:'review', name:'Người duyệt', type:'Vai trò workflow', policyGroup:true, status:'Đang dùng', members:['USR-003'], description:'Đánh giá tài liệu được gửi duyệt.'},
      {id:'release', name:'Người phát hành', type:'Vai trò workflow', policyGroup:true, status:'Đang dùng', members:['USR-003'], description:'Phát hành bộ hồ sơ đã qua kiểm tra.'},
      {id:'quality', name:'Chất lượng', type:'Nhóm quyền', policyGroup:true, status:'Đang dùng', members:['USR-004'], description:'Kiểm tra bằng chứng và hồ sơ phát hành.'},
      {id:'view', name:'Người xem', type:'Nhóm quyền', policyGroup:true, status:'Đang dùng', members:['USR-006'], description:'Đọc tài liệu đã được cấp quyền.'},
      {id:'pdm-admin', name:'Quản trị PDM', type:'Nhóm quản trị', policyGroup:false, status:'Đang dùng', members:['USR-001'], description:'Định nghĩa bộ quyền và cấu hình PDM; không dùng để cấp quyền tài liệu.'},
      {id:'access-admin', name:'Quản trị người dùng và phân quyền', type:'Nhóm quản trị', policyGroup:false, status:'Đang dùng', members:['USR-005'], description:'Quản lý người dùng, tài khoản, nhóm và gán thành viên vào nhóm.'}
    ];
    const states = ['Start','In Work','Under Review','Đã duyệt · chờ phát hành','Released','Superseded'];
    const actions = ['Xem','Tạo','Checkout','Check-in','Reference','Gửi duyệt','Phê duyệt','Phát hành','Tạo Revision'];
    const documentTypes = ['CAD file','Engineering Definition','Technical Specification','Interface Specification','Controlled Record','Work Instruction','Risk Assessment'];
    const baseMatrix = {
      Start:          [1,1,1,0,1,0,0,0,0],
      'In Work':      [1,0,1,1,1,1,0,0,0],
      'Under Review': [1,0,0,0,1,0,0,0,0],
      'Đã duyệt · chờ phát hành': [1,0,0,0,1,0,0,0,0],
      Released:       [1,0,0,0,1,0,0,0,1],
      Superseded:     [1,0,0,0,1,0,0,0,0]
    };
    const policies = {};
    groups.filter((group) => group.policyGroup).forEach((group) => documentTypes.forEach((type) => {
      const matrix = clone(baseMatrix);
      if (group.id === 'review') matrix['Under Review'][6] = 1;
      if (group.id === 'release') matrix['Đã duyệt · chờ phát hành'][7] = 1;
      if (group.id === 'view') states.forEach((state) => matrix[state] = [1,0,0,0,1,0,0,0,0]);
      policies[group.id + '|' + type] = matrix;
    }));
    const workflows = [
      {name:'Tài liệu kỹ thuật chuẩn', version:'WF-003', applies:'Engineering Definition, Technical Specification, Interface Specification, CAD file', state:'Đang dùng'},
      {name:'Hồ sơ kiểm tra', version:'WF-002', applies:'Controlled Record', state:'Đang dùng'},
      {name:'Hướng dẫn công việc', version:'WF-001', applies:'Work Instruction, Risk Assessment', state:'Đang dùng'}
    ];
    const types = [
      {name:'CAD file', prefix:'CAD-{PROJECT}-{SEQ}', workflow:'Tài liệu kỹ thuật chuẩn', profile:'CAD'},
      {name:'Engineering Definition', prefix:'ED-{PROJECT}-{SEQ}', workflow:'Tài liệu kỹ thuật chuẩn', profile:'PDF kỹ thuật'},
      {name:'Technical Specification', prefix:'TS-{PROJECT}-{SEQ}', workflow:'Tài liệu kỹ thuật chuẩn', profile:'Office + PDF'},
      {name:'Interface Specification', prefix:'IF-{PROJECT}-{SEQ}', workflow:'Tài liệu kỹ thuật chuẩn', profile:'Office + PDF'},
      {name:'Controlled Record', prefix:'CR-{PROJECT}-{SEQ}', workflow:'Hồ sơ kiểm tra', profile:'PDF kỹ thuật'},
      {name:'Work Instruction', prefix:'WI-{PROJECT}-{SEQ}', workflow:'Hướng dẫn công việc', profile:'Office + PDF'},
      {name:'Risk Assessment', prefix:'RA-{PROJECT}-{SEQ}', workflow:'Hướng dẫn công việc', profile:'Office + PDF'}
    ];
    const formatProfiles = [
      {name:'CAD', extensions:'SLDPRT, SLDASM, DWG, STEP', capability:'Mục tiêu Level 3', state:'Đang dùng'},
      {name:'Office + PDF', extensions:'DOCX, XLSX, PPTX, PDF', capability:'Mục tiêu Level 3', state:'Đang dùng'},
      {name:'PDF kỹ thuật', extensions:'PDF', capability:'Mục tiêu Level 3', state:'Đang dùng'}
    ];
    const audit = [
      {at:'09/09/2026 08:20', actor:'Nguyễn Huỳnh Phúc Lâm', action:'Kích hoạt chính sách', target:'POL-004', result:'Thành công', domain:'pdm'},
      {at:'09/09/2026 08:18', actor:'Nguyễn Huỳnh Phúc Lâm', action:'Thay quyền Checkout', target:'Kỹ sư thiết kế · CAD file', result:'Thành công', domain:'pdm'},
      {at:'08/09/2026 15:42', actor:'Quản trị viên QLHT', action:'Gán nhóm quyền', target:'Minh Trần → Người duyệt', result:'Thành công', domain:'account'},
      {at:'08/09/2026 09:10', actor:'Tài khoản quản trị QLHT', action:'Khóa tài khoản', target:'sora.ito', result:'Thành công', domain:'account'},
      {at:'07/09/2026 16:03', actor:'Tài khoản quản trị QLHT', action:'Thu hồi phiên', target:'minh.tran', result:'Thành công', domain:'account'}
    ];

    const state = {
      actor:'account', page:'users', selectedGroup:'design', selectedUser:'USR-002', selectedAccount:'linh.nguyen', selectedType:'CAD file', selectedState:'In Work', selectedAction:'Checkout', selectedScope:'Khu vực kỹ thuật P-100', activePolicy:'POL-004', draft:null, modal:null
    };
    const nav = {
      pdm: [
        ['policies','shield','Bộ quyền tài liệu'], ['effective','key','Quyền thực tế'],
        ['workflows','flow','Lifecycle và workflow'], ['types','file','Loại tài liệu'], ['formats','file','Định dạng'], ['audit','history','Lịch sử cấu hình']
      ],
      account: [
        ['users','users','Người dùng'], ['accounts','user','Tài khoản đăng nhập'], ['groups','users','Nhóm quyền'],
        ['assignments','key','Gán quyền'], ['effective','key','Quyền thực tế'], ['accountAudit','history','Lịch sử thay đổi']
      ]
    };

    function actor() { return actors[state.actor]; }
    function group() { return groups.find((item) => item.id === state.selectedGroup) || groups[0]; }
    function user() { return users.find((item) => item.id === state.selectedUser) || users[0]; }
    function account() { return accounts.find((item) => item.id === state.selectedAccount) || accounts[0]; }
    function userById(id) { return users.find((item) => item.id === id); }
    function accountForUser(userId) { return accounts.find((item) => item.userId === userId); }
    function groupsForUser(userId) { return groups.filter((item) => item.members.includes(userId)); }
    function activePolicyGroups() { return groups.filter((item) => item.policyGroup && item.status === 'Đang dùng'); }
    function isActiveUser(userId) { return userById(userId)?.status === 'Đang dùng'; }
    function isActiveAccountForUser(userId) { return accountForUser(userId)?.status === 'Hoạt động'; }
    function isLastAdminMember(targetGroup, userId) {
      if (!['access-admin','pdm-admin'].includes(targetGroup.id) || !targetGroup.members.includes(userId)) return false;
      return targetGroup.members.filter((id) => id !== userId && isActiveUser(id) && isActiveAccountForUser(id)).length === 0;
    }
    function matrixKey() { return state.selectedGroup + '|' + state.selectedType; }
    function activeMatrix() { return policies[matrixKey()]; }
    function shownMatrix() { return state.draft?.key === matrixKey() ? state.draft.matrix : activeMatrix(); }
    function diffCells() {
      if (!state.draft) return [];
      const base = policies[state.draft.key];
      const result = [];
      states.forEach((row, ri) => actions.forEach((actionName, ai) => {
        if (base[row][ai] !== state.draft.matrix[row][ai]) result.push({state:row, action:actionName, before:base[row][ai], after:state.draft.matrix[row][ai]});
      }));
      return result;
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.hidden = false;
      clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.hidden = true, 3800);
    }
    function logAudit(domain, action, target, result = 'Thành công') {
      audit.unshift({at:new Date().toLocaleString('vi-VN', {hour12:false}), actor:actor().name, action, target, result, domain});
    }
    function statusClass(value) {
      return value === 'Hoạt động' || value === 'Đang dùng' || value === 'Thành công' ? 'green' : value === 'Đã khóa' || value === 'Ngừng dùng' ? 'gray' : value === 'Bản nháp' ? 'amber' : 'blue';
    }

    function renderNavigation() {
      const items = nav[state.actor];
      const groupName = state.actor === 'pdm' ? 'QUẢN TRỊ PDM' : 'NGƯỜI DÙNG VÀ QUYỀN';
      document.getElementById('navigation').innerHTML = '<div class="rail-section-title">' + groupName + '</div>' + items.map((item) =>
        '<button class="nav-item ' + (state.page === item[0] ? 'active' : '') + '" type="button" data-page="' + item[0] + '">' + icon(item[1]) + '<span>' + item[2] + '</span>' + (item[0] === 'audit' || item[0] === 'accountAudit' ? '<span class="nav-badge">' + audit.filter((entry) => entry.domain === (state.actor === 'pdm' ? 'pdm' : 'account')).length + '</span>' : '') + '</button>'
      ).join('');
      document.getElementById('rail-role').textContent = actor().role;
      document.getElementById('rail-person').textContent = actor().name;
      document.getElementById('rail-note').textContent = actor().note;
    }

    function pageMeta() {
      const meta = {
        users:['Người dùng','Quản lý hồ sơ người dùng ổn định, tách khỏi tên đăng nhập.'],
        accounts:['Tài khoản đăng nhập','Cấp, khóa và hỗ trợ khôi phục tài khoản IDEA.'],
        groups:['Nhóm quyền','Tạo nhóm và quản lý người dùng thuộc từng nhóm.'],
        assignments:['Gán quyền','Đưa người dùng vào nhóm đã được cấu hình quyền và phạm vi.'],
        policies:['Bộ quyền tài liệu','Quản trị PDM định nghĩa quyền theo nhóm, loại tài liệu và trạng thái.'],
        effective:['Quyền thực tế','Kiểm tra một người được phép làm gì và quyền đến từ đâu.'],
        workflows:['Lifecycle và workflow','Xem quy trình đang áp dụng cho từng loại tài liệu.'],
        types:['Loại tài liệu','Đặt loại tài liệu, quy tắc mã, workflow và profile định dạng.'],
        formats:['Định dạng','Quản lý profile định dạng để có thể thêm loại file về sau.'],
        audit:['Lịch sử cấu hình','Theo dõi các thay đổi cấu hình đã thực hiện.'],
        accountAudit:['Lịch sử thay đổi','Theo dõi thao tác người dùng, tài khoản, nhóm và gán quyền.']
      };
      return meta[state.page];
    }
    function renderHeader() {
      const meta = pageMeta();
      document.getElementById('crumb-current').textContent = meta[0];
      document.getElementById('page-title').textContent = meta[0];
      document.getElementById('page-subtitle').textContent = meta[1];
      const actionsBox = document.getElementById('head-actions');
      if (state.page === 'users') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-user">' + icon('plus') + ' Tạo người dùng</button>';
      else if (state.page === 'accounts') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-account">' + icon('plus') + ' Cấp tài khoản</button>';
      else if (state.page === 'groups') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-group">' + icon('plus') + ' Tạo nhóm</button>';
      else if (state.page === 'policies' && !state.draft) actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-policy-draft">' + icon('plus') + ' Tạo bản sửa</button>';
      else if (state.page === 'types') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-type">' + icon('plus') + ' Thêm loại</button>';
      else if (state.page === 'formats') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-format">' + icon('plus') + ' Thêm profile</button>';
      else if (state.page === 'workflows') actionsBox.innerHTML = '<button class="button primary" type="button" data-action="new-workflow">' + icon('plus') + ' Tạo workflow</button>';
      else actionsBox.innerHTML = '';
    }

    function renderGroups() {
      const memberRows = group().members.map((id) => {
        const item = userById(id); const linked = accountForUser(id); const lastOperator = isLastAdminMember(group(), id);
        return '<tr><td class="mono">' + esc(item.id) + '</td><td class="item-title"><strong>' + esc(item.name) + '</strong></td><td>' + esc(item.department) + '</td><td class="mono">' + esc(linked?.id || 'Chưa cấp') + '</td><td><span class="status ' + statusClass(item.status) + '">' + esc(item.status) + '</span></td><td><button class="button small danger" type="button" data-remove-member="' + esc(item.id) + '" ' + (lastOperator ? 'disabled title="Phải có quản trị viên thay thế"' : '') + '>Bỏ khỏi nhóm</button></td></tr>';
      }).join('') || '<tr><td colspan="6" class="empty"><strong>Chưa có thành viên</strong>Thêm người dùng khi cần cấp nhóm này.</td></tr>';
      return '<div class="split"><section class="panel"><div class="panel-head"><h2>Nhóm</h2><small>' + groups.length + ' nhóm</small></div>' + groups.map((item) =>
        '<button class="list-button ' + (state.selectedGroup === item.id ? 'active' : '') + '" type="button" data-group="' + item.id + '"><span><strong>' + esc(item.name) + '</strong><small>' + esc(item.type) + ' · ' + esc(item.status) + '</small></span><span class="nav-badge">' + item.members.length + '</span></button>'
      ).join('') + '</section><section class="panel"><div class="panel-head"><h2>Thành viên · ' + esc(group().name) + '</h2><button class="button small" type="button" data-action="add-member" ' + (group().status !== 'Đang dùng' ? 'disabled title="Nhóm đã ngừng sử dụng"' : '') + '>' + icon('plus') + ' Thêm thành viên</button></div><div class="table-scroll"><table><thead><tr><th>Mã người dùng</th><th>Họ tên</th><th>Phòng ban</th><th>Tài khoản</th><th>Trạng thái</th><th></th></tr></thead><tbody>' + memberRows + '</tbody></table></div></section></div>';
    }

    function renderPolicies() {
      const editable = state.draft?.key === matrixKey();
      const matrix = shownMatrix();
      const rows = states.map((row) => '<tr><td><strong>' + esc(row) + '</strong></td>' + actions.map((actionName, index) => '<td><input type="checkbox" data-policy-state="' + esc(row) + '" data-policy-action="' + index + '" ' + (matrix[row][index] ? 'checked' : '') + ' ' + (editable ? '' : 'disabled') + ' aria-label="' + esc(actionName + ' khi ' + row) + '"></td>').join('') + '</tr>').join('');
      const changes = diffCells();
      return '<div class="toolbar"><div class="field"><label for="policy-group">Nhóm</label><select id="policy-group">' + activePolicyGroups().map((g) => '<option value="' + g.id + '" ' + (g.id === state.selectedGroup ? 'selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select></div><div class="field grow"><label for="policy-type">Loại tài liệu</label><select id="policy-type">' + documentTypes.map((type) => '<option ' + (type === state.selectedType ? 'selected' : '') + '>' + esc(type) + '</option>').join('') + '</select></div><div class="field"><label for="policy-scope">Phạm vi đang cấu hình</label><input id="policy-scope" value="Khu vực kỹ thuật P-100" readonly></div></div>' +
        '<section class="panel"><div class="panel-head"><h2>Ma trận quyền</h2><small>' + (editable ? 'Đang sửa · chưa có hiệu lực' : 'Chỉ đọc · ' + state.activePolicy + ' đang hoạt động') + '</small></div><div class="table-scroll"><table class="matrix"><thead><tr><th>Trạng thái</th>' + actions.map((item) => '<th>' + esc(item) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
        '<div class="draftbar"><span class="status ' + (editable ? 'amber' : 'green') + '">' + (editable ? 'Bản nháp POL-005' : state.activePolicy + ' đang dùng') + '</span><span><strong>' + (editable ? changes.length + ' thay đổi' : 'Chính sách đang hoạt động') + '</strong><br><small>' + (editable ? 'Chưa ảnh hưởng tới người dùng.' : 'Tạo bản sửa để thay đổi quyền.') + '</small></span><span class="actions">' + (editable ? '<button class="button" type="button" data-action="discard-policy">Bỏ bản nháp</button><button class="button primary" type="button" data-action="review-policy" ' + (!changes.length ? 'disabled' : '') + '>Xem thay đổi</button>' : '') + '</span></div>';
    }

    function effectiveDecision() {
      const selected = user();
      const linkedAccount = accountForUser(selected.id);
      const memberGroups = groups.filter((g) => g.members.includes(selected.id) && g.policyGroup && g.status === 'Đang dùng');
      const actionIndex = actions.indexOf(state.selectedAction);
      const sources = memberGroups.filter((g) => policies[g.id + '|' + state.selectedType]?.[state.selectedState]?.[actionIndex]);
      return {allowed:sources.length > 0 && selected.status === 'Đang dùng' && linkedAccount?.status === 'Hoạt động', sources, linkedAccount};
    }
    function renderEffective() {
      const result = effectiveDecision();
      const sourceText = result.sources.length ? result.sources.map((g) => g.name).join(', ') : 'Không có nhóm cấp quyền';
      const accountText = result.linkedAccount ? result.linkedAccount.id + ' · ' + result.linkedAccount.status : 'Chưa cấp tài khoản đăng nhập';
      return '<div class="toolbar"><div class="field grow"><label for="effective-user">Người dùng</label><select id="effective-user">' + users.map((item) => '<option value="' + item.id + '" ' + (item.id === state.selectedUser ? 'selected' : '') + '>' + esc(item.name + ' · ' + item.id) + '</option>').join('') + '</select></div><div class="field"><label for="effective-type">Loại tài liệu</label><select id="effective-type">' + documentTypes.map((type) => '<option ' + (type === state.selectedType ? 'selected' : '') + '>' + esc(type) + '</option>').join('') + '</select></div><div class="field"><label for="effective-state">Trạng thái</label><select id="effective-state">' + states.map((value) => '<option ' + (value === state.selectedState ? 'selected' : '') + '>' + esc(value) + '</option>').join('') + '</select></div><div class="field"><label for="effective-action">Thao tác</label><select id="effective-action">' + actions.map((value) => '<option ' + (value === state.selectedAction ? 'selected' : '') + '>' + esc(value) + '</option>').join('') + '</select></div></div>' +

      const content = document.getElementById('content');

      else if (state.page === 'assignments') content.innerHTML = renderAssignments();

      else if (state.page === 'workflows') content.innerHTML = renderWorkflows();
      else if (state.page === 'types') content.innerHTML = renderTypes();
      else if (state.page === 'formats') content.innerHTML = renderFormats();
      else if (state.page === 'audit') content.innerHTML = renderAudit(false);
      else if (state.page === 'accounts') content.innerHTML = renderAccounts();
      else content.innerHTML = renderAudit(true);
    }

    function render() {
      renderNavigation(); renderHeader(); renderContent(); renderInspector();
      document.getElementById('policy-status').textContent = state.actor === 'pdm' ? 'Chính sách: ' + state.activePolicy : 'Quản lý: người dùng · tài khoản · nhóm';
    }

    function openModal(title, subtitle, body, foot) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-subtitle').textContent = subtitle;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-foot').innerHTML = foot;
      document.getElementById('modal-error').hidden = true;
      state.modalReturn = document.activeElement;
      document.getElementById('modal-backdrop').hidden = false;
      document.querySelector('[data-close-modal]').focus();
    }
    function closeModal() {
      document.getElementById('modal-backdrop').hidden = true;
      state.modal = null;
      if (state.modalReturn?.focus) state.modalReturn.focus();
      state.modalReturn = null;
    }
    function modalError(message) {
      const box = document.getElementById('modal-error');
      box.textContent = message; box.hidden = false; box.focus?.();
    }

    function reviewPolicy() {
      const changes = diffCells();
      openModal('Kiểm tra bản sửa POL-005','Quyền chỉ thay đổi sau khi kích hoạt.', '<ul class="change-list">' + changes.map((item) => '<li><span>' + esc(item.state + ' · ' + item.action) + '</span><strong>' + (item.after ? 'Không cho phép → Cho phép' : 'Cho phép → Không cho phép') + '</strong></li>').join('') + '</ul><div class="field" style="margin-top:11px"><label for="policy-change-reason">Lý do kích hoạt</label><textarea id="policy-change-reason" required></textarea></div>', '<button class="button" type="button" data-close-modal>Quay lại</button><button class="button primary" type="button" data-confirm-activate>Kích hoạt POL-005</button>');
    }

    document.addEventListener('click', (event) => {
      const page = event.target.closest('[data-page]');
      if (page) {
        if (state.draft && page.dataset.page !== 'policies') { showToast('Kích hoạt hoặc bỏ bản nháp trước khi rời trang bộ quyền.'); return; }
        if (page.dataset.page === 'policies' && !activePolicyGroups().some((item) => item.id === state.selectedGroup)) state.selectedGroup = activePolicyGroups()[0]?.id || 'design';
        state.page = page.dataset.page; render(); document.getElementById('main-content').focus(); return;
      }
      const selectedGroup = event.target.closest('[data-group]');
      if (selectedGroup) { state.selectedGroup = selectedGroup.dataset.group; render(); return; }
      const selectedUser = event.target.closest('[data-user]');
      if (selectedUser) { state.selectedUser = selectedUser.dataset.user; const linked = accountForUser(state.selectedUser); if (linked) state.selectedAccount = linked.id; render(); return; }
      const selectedAccount = event.target.closest('[data-account]');
      if (selectedAccount) { state.selectedAccount = selectedAccount.dataset.account; state.selectedUser = account().userId; render(); return; }
      const removeMember = event.target.closest('[data-remove-member]');
      if (removeMember) {
        const id = removeMember.dataset.removeMember;
        if (isLastAdminMember(group(), id)) { showToast('Phải có quản trị viên thay thế trước khi bỏ người cuối cùng.'); return; }
        group().members = group().members.filter((memberId) => memberId !== id);
        logAudit('account','Bỏ nhóm quyền',userById(id).name + ' ← ' + group().name); render(); showToast('Đã bỏ người dùng khỏi nhóm.'); return;
      }
      const toggleAssignment = event.target.closest('[data-toggle-assignment]');
      if (toggleAssignment) {
        const target = groups.find((item) => item.id === toggleAssignment.dataset.toggleAssignment);
        if (!target || target.status !== 'Đang dùng') return;
        const assigned = target.members.includes(user().id);
        if (assigned && isLastAdminMember(target, user().id)) { showToast('Phải có quản trị viên thay thế trước khi bỏ nhóm này.'); return; }
        target.members = assigned ? target.members.filter((id) => id !== user().id) : [...target.members, user().id];
        logAudit('account',assigned ? 'Bỏ nhóm quyền' : 'Gán nhóm quyền',user().name + (assigned ? ' ← ' : ' → ') + target.name);
        render(); showToast(assigned ? 'Đã bỏ nhóm quyền.' : 'Đã gán nhóm quyền.'); return;
      }
      if (event.target.closest('[data-close-modal]')) { closeModal(); return; }
      if (event.target.closest('[data-confirm-activate]')) {
        const reason = document.getElementById('policy-change-reason').value.trim();
        if (!reason) { modalError('Nhập lý do trước khi kích hoạt chính sách.'); return; }
        policies[state.draft.key] = clone(state.draft.matrix); state.activePolicy = 'POL-005';
        logAudit('pdm','Kích hoạt chính sách','POL-005 · ' + reason); state.draft = null; closeModal(); render(); showToast('POL-005 đã được kích hoạt.'); return;
      }
      const actionNode = event.target.closest('[data-action]');
      if (!actionNode) return;
      const action = actionNode.dataset.action;
      if (action === 'new-policy-draft') { state.draft = {key:matrixKey(), matrix:clone(activeMatrix())}; render(); showToast('Đã tạo bản nháp POL-005.'); }
      else if (action === 'discard-policy') { state.draft = null; render(); showToast('Đã bỏ bản nháp.'); }
      else if (action === 'review-policy') reviewPolicy();
      else if (action === 'new-type') {
        openModal('Thêm loại tài liệu','Loại mới có thể được gắn workflow và profile định dạng.', '<div class="form-grid"><div class="field"><label for="new-type-name">Tên loại</label><input id="new-type-name" autocomplete="off"></div><div class="field"><label for="new-type-prefix">Quy tắc mã</label><input id="new-type-prefix" placeholder="XX-{PROJECT}-{SEQ}" autocomplete="off"></div><div class="field"><label for="new-type-workflow">Workflow mặc định</label><select id="new-type-workflow">' + workflows.map((item) => '<option>' + esc(item.name) + '</option>').join('') + '</select></div><div class="field"><label for="new-type-profile">Profile định dạng</label><select id="new-type-profile">' + formatProfiles.map((item) => '<option>' + esc(item.name) + '</option>').join('') + '</select></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-type>Thêm loại</button>');
      } else if (action === 'new-format') {
        openModal('Thêm profile định dạng','Profile giúp thêm định dạng file mà không phải sửa từng loại tài liệu.', '<div class="form-grid"><div class="field"><label for="new-format-name">Tên profile</label><input id="new-format-name" autocomplete="off"></div><div class="field"><label for="new-format-files">Định dạng file</label><input id="new-format-files" placeholder="EXT1, EXT2" autocomplete="off"></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-format>Thêm profile</button>');
      } else if (action === 'new-workflow') {
        openModal('Tạo workflow','Workflow mới được tạo ở trạng thái bản nháp.', '<div class="form-grid"><div class="field"><label for="new-workflow-name">Tên workflow</label><input id="new-workflow-name" autocomplete="off"></div><div class="field"><label for="new-workflow-applies">Áp dụng cho</label><input id="new-workflow-applies" placeholder="Tên loại tài liệu" autocomplete="off"></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-workflow>Tạo bản nháp</button>');
      } else if (action === 'new-user') {
        openModal('Tạo người dùng','Người dùng là danh tính ổn định; có thể cấp tài khoản sau.', '<div class="form-grid"><div class="field"><label for="new-user-id">Mã người dùng</label><input id="new-user-id" placeholder="USR-007" autocomplete="off"></div><div class="field"><label for="new-user-name">Họ tên</label><input id="new-user-name" autocomplete="name"></div><div class="field full"><label for="new-user-dept">Phòng ban</label><input id="new-user-dept"></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-user>Tạo người dùng</button>');
      } else if (action === 'edit-user') {
        openModal('Sửa người dùng',user().id, '<div class="form-grid"><div class="field full"><label for="edit-user-name">Họ tên</label><input id="edit-user-name" value="' + esc(user().name) + '" autocomplete="name"></div><div class="field full"><label for="edit-user-dept">Phòng ban</label><input id="edit-user-dept" value="' + esc(user().department) + '"></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-user-edit>Lưu thay đổi</button>');
      } else if (action === 'toggle-user') {
        const next = user().status === 'Đang dùng' ? 'Ngừng dùng' : 'Đang dùng';
        openModal(next === 'Ngừng dùng' ? 'Ngừng sử dụng người dùng' : 'Dùng lại người dùng',user().name + ' · ' + user().id, '<div class="note warning">' + (next === 'Ngừng dùng' ? 'Người dùng sẽ không còn đủ điều kiện nhận quyền. Lịch sử và tài khoản liên kết vẫn được giữ.' : 'Người dùng có thể được gán nhóm lại; tài khoản vẫn cần ở trạng thái hoạt động để đăng nhập.') + '</div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button ' + (next === 'Ngừng dùng' ? 'danger' : 'primary') + '" type="button" data-confirm-user-status="' + next + '">Xác nhận</button>');
      } else if (action === 'new-account') {
        const available = users.filter((item) => !accountForUser(item.id) && item.status === 'Đang dùng');
        if (!available.length) { showToast('Không có người dùng nào đang chờ cấp tài khoản.'); return; }
        openModal('Cấp tài khoản IDEA','Tài khoản chỉ là cách đăng nhập; quyền được gán bằng nhóm trên trang Gán quyền.', '<div class="form-grid"><div class="field full"><label for="new-account-user">Người dùng</label><select id="new-account-user">' + available.map((item) => '<option value="' + item.id + '">' + esc(item.name + ' · ' + item.id) + '</option>').join('') + '</select></div><div class="field"><label for="new-account-id">Tên đăng nhập</label><input id="new-account-id" autocomplete="username"></div><div class="field"><label for="new-account-method">Phương thức</label><select id="new-account-method"><option>Tài khoản IDEA</option></select></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-account>Cấp tài khoản</button>');
      } else if (action === 'new-group') {
        openModal('Tạo nhóm quyền','Nhóm không có quyền cho đến khi Quản trị PDM cấu hình bộ quyền của nhóm.', '<div class="form-grid"><div class="field"><label for="new-group-name">Tên nhóm</label><input id="new-group-name" autocomplete="off"></div><div class="field"><label for="new-group-type">Loại nhóm</label><select id="new-group-type"><option>Nhóm quyền</option><option>Vai trò workflow</option><option>Nhóm quản trị</option></select></div><div class="field full"><label for="new-group-description">Mô tả</label><textarea id="new-group-description"></textarea></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-group>Tạo nhóm</button>');
      } else if (action === 'edit-group') {
        openModal('Sửa nhóm',group().id, '<div class="form-grid"><div class="field full"><label for="edit-group-name">Tên nhóm</label><input id="edit-group-name" value="' + esc(group().name) + '"></div><div class="field full"><label for="edit-group-description">Mô tả</label><textarea id="edit-group-description">' + esc(group().description) + '</textarea></div></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-group-edit>Lưu thay đổi</button>');
      } else if (action === 'toggle-group') {
        const next = group().status === 'Đang dùng' ? 'Ngừng dùng' : 'Đang dùng';
        openModal(next === 'Ngừng dùng' ? 'Ngừng sử dụng nhóm' : 'Dùng lại nhóm',group().name, '<div class="note warning">' + (next === 'Ngừng dùng' ? 'Nhóm sẽ không còn cấp quyền mới; lịch sử gán và Audit vẫn được giữ.' : 'Nhóm có thể được gán lại cho người dùng.') + '</div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button ' + (next === 'Ngừng dùng' ? 'danger' : 'primary') + '" type="button" data-confirm-group-status="' + next + '">Xác nhận</button>');
      } else if (action === 'add-member') {
        const available = users.filter((item) => !group().members.includes(item.id) && item.status === 'Đang dùng');
        if (!available.length) { showToast('Không có người dùng phù hợp để thêm vào nhóm.'); return; }
        openModal('Thêm thành viên','Chọn người dùng cho nhóm ' + group().name + '.', '<div class="field"><label for="member-user">Người dùng</label><select id="member-user">' + available.map((item) => '<option value="' + item.id + '">' + esc(item.name + ' · ' + item.id) + '</option>').join('') + '</select></div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-member>Thêm vào nhóm</button>');
      } else if (action === 'toggle-account') {
        const next = account().status === 'Hoạt động' ? 'Đã khóa' : 'Hoạt động'; const owner = userById(account().userId);
        openModal(next === 'Đã khóa' ? 'Khóa tài khoản' : 'Mở lại tài khoản',owner.name + ' · ' + account().id, '<div class="note warning">' + (next === 'Đã khóa' ? 'Tài khoản sẽ không thể đăng nhập hoặc thực hiện thao tác mới.' : 'Tài khoản có thể đăng nhập lại; quyền tài liệu vẫn do nhóm và bộ quyền riêng quyết định.') + '</div>', '<button class="button" type="button" data-close-modal>Hủy</button><button class="button ' + (next === 'Đã khóa' ? 'danger' : 'primary') + '" type="button" data-confirm-account-status="' + next + '">Xác nhận</button>');
      } else if (action === 'revoke-session') {
        logAudit('account','Thu hồi phiên',account().id); render(); showToast('Đã ghi nhận thu hồi phiên đăng nhập.');
      } else if (action === 'reset-account') {
        openModal('Hỗ trợ đặt lại tài khoản',account().id,'<div class="note warning">Tạo một yêu cầu đặt lại dùng một lần. Prototype không hiển thị hoặc gửi mật khẩu.</div>','<button class="button" type="button" data-close-modal>Hủy</button><button class="button primary" type="button" data-confirm-reset>Tạo yêu cầu</button>');
      }
    });

    document.addEventListener('click', (event) => {
      const member = event.target.closest('[data-confirm-member]');
      if (member) { const id = document.getElementById('member-user').value; group().members.push(id); logAudit('account','Gán nhóm quyền',userById(id).name + ' → ' + group().name); closeModal(); render(); showToast('Đã thêm người dùng vào nhóm.'); return; }
      const createUser = event.target.closest('[data-confirm-user]');
      if (createUser) {
        const id = document.getElementById('new-user-id').value.trim(); const name = document.getElementById('new-user-name').value.trim(); const department = document.getElementById('new-user-dept').value.trim();
        if (!id || !name || !department) { modalError('Nhập đủ mã người dùng, họ tên và phòng ban.'); return; }
        if (users.some((item) => item.id.toLowerCase() === id.toLowerCase())) { modalError('Mã người dùng đã tồn tại.'); return; }
        users.push({id,name,department,status:'Đang dùng'}); state.selectedUser = id; logAudit('account','Tạo người dùng',id); closeModal(); render(); showToast('Đã tạo người dùng. Có thể cấp tài khoản sau.'); return;
      }
      const editUser = event.target.closest('[data-confirm-user-edit]');
      if (editUser) {
        const name = document.getElementById('edit-user-name').value.trim(); const department = document.getElementById('edit-user-dept').value.trim();
        if (!name || !department) { modalError('Nhập đủ họ tên và phòng ban.'); return; }
        user().name = name; user().department = department; logAudit('account','Sửa người dùng',user().id); closeModal(); render(); showToast('Đã lưu thông tin người dùng.'); return;
      }
      const createAccount = event.target.closest('[data-confirm-account]');
      if (createAccount) {
        const userId = document.getElementById('new-account-user').value; const id = document.getElementById('new-account-id').value.trim(); const method = document.getElementById('new-account-method').value;
        if (!id) { modalError('Nhập tên đăng nhập.'); return; }
        if (accounts.some((item) => item.id.toLowerCase() === id.toLowerCase())) { modalError('Tên đăng nhập đã tồn tại.'); return; }
        accounts.push({id,userId,method,status:'Hoạt động',last:'Chưa đăng nhập'}); state.selectedAccount = id; state.selectedUser = userId; logAudit('account','Cấp tài khoản',id + ' → ' + userById(userId).name); closeModal(); render(); showToast('Đã cấp tài khoản. Chưa tự cấp quyền tài liệu.'); return;
      }
      const createGroup = event.target.closest('[data-confirm-group]');
      if (createGroup) {
        const name = document.getElementById('new-group-name').value.trim(); const type = document.getElementById('new-group-type').value; const description = document.getElementById('new-group-description').value.trim();
        if (!name || !description) { modalError('Nhập tên và mô tả nhóm.'); return; }
        if (groups.some((item) => item.name.toLowerCase() === name.toLowerCase())) { modalError('Tên nhóm đã tồn tại.'); return; }
        const id = 'grp-' + String(groups.length + 1).padStart(3,'0'); const policyGroup = type !== 'Nhóm quản trị';
        groups.push({id,name,type,policyGroup,status:'Đang dùng',members:[],description});
        if (policyGroup) documentTypes.forEach((documentType) => { policies[id + '|' + documentType] = clone(baseMatrix); });
        state.selectedGroup = id; logAudit('account','Tạo nhóm quyền',name); closeModal(); render(); showToast('Đã tạo nhóm. Quản trị PDM có thể cấu hình bộ quyền của nhóm.'); return;
      }
      const editGroup = event.target.closest('[data-confirm-group-edit]');
      if (editGroup) {
        const name = document.getElementById('edit-group-name').value.trim(); const description = document.getElementById('edit-group-description').value.trim();
        if (!name || !description) { modalError('Nhập tên và mô tả nhóm.'); return; }
        if (groups.some((item) => item.id !== group().id && item.name.toLowerCase() === name.toLowerCase())) { modalError('Tên nhóm đã tồn tại.'); return; }
        group().name = name; group().description = description; logAudit('account','Sửa nhóm quyền',group().id); closeModal(); render(); showToast('Đã lưu thông tin nhóm.'); return;
      }
      const type = event.target.closest('[data-confirm-type]');
      if (type) {
        const name = document.getElementById('new-type-name').value.trim(); const prefix = document.getElementById('new-type-prefix').value.trim(); const workflow = document.getElementById('new-type-workflow').value; const profile = document.getElementById('new-type-profile').value;
        if (!name || !prefix) { modalError('Nhập tên loại và quy tắc mã.'); return; }
        if (documentTypes.some((item) => item.toLowerCase() === name.toLowerCase())) { modalError('Loại tài liệu này đã tồn tại.'); return; }
        documentTypes.push(name); types.push({name,prefix,workflow,profile});
        groups.filter((item) => item.policyGroup).forEach((item) => {
          const matrix = clone(baseMatrix);
          if (item.id === 'review') matrix['Under Review'][6] = 1;
          if (item.id === 'release') matrix['Đã duyệt · chờ phát hành'][7] = 1;
          if (item.id === 'view') states.forEach((row) => matrix[row] = [1,0,0,0,1,0,0,0,0]);
          policies[item.id + '|' + name] = matrix;
        });
        logAudit('pdm','Thêm loại tài liệu',name); closeModal(); render(); showToast('Đã thêm loại tài liệu.'); return;
      }
      const format = event.target.closest('[data-confirm-format]');
      if (format) {
        const name = document.getElementById('new-format-name').value.trim(); const extensions = document.getElementById('new-format-files').value.trim();
        if (!name || !extensions) { modalError('Nhập tên profile và định dạng file.'); return; }
        if (formatProfiles.some((item) => item.name.toLowerCase() === name.toLowerCase())) { modalError('Profile định dạng này đã tồn tại.'); return; }
        formatProfiles.push({name,extensions,capability:'Mục tiêu Level 3',state:'Đang dùng'}); logAudit('pdm','Thêm profile định dạng',name); closeModal(); render(); showToast('Đã thêm profile định dạng.'); return;
      }
      const workflow = event.target.closest('[data-confirm-workflow]');
      if (workflow) {
        const name = document.getElementById('new-workflow-name').value.trim(); const applies = document.getElementById('new-workflow-applies').value.trim();
        if (!name || !applies) { modalError('Nhập tên workflow và loại tài liệu áp dụng.'); return; }
        if (workflows.some((item) => item.name.toLowerCase() === name.toLowerCase())) { modalError('Workflow này đã tồn tại.'); return; }
        workflows.push({name,version:'WF-' + String(workflows.length + 1).padStart(3,'0'),applies,state:'Bản nháp'}); logAudit('pdm','Tạo workflow',name); closeModal(); render(); showToast('Đã tạo workflow ở trạng thái bản nháp.'); return;
      }
      const reset = event.target.closest('[data-confirm-reset]');
      if (reset) { logAudit('account','Tạo yêu cầu đặt lại',account().id); closeModal(); render(); showToast('Đã tạo yêu cầu đặt lại dùng một lần.'); return; }
      const accountStatus = event.target.closest('[data-confirm-account-status]');
      if (accountStatus) { const next = accountStatus.dataset.confirmAccountStatus; account().status = next; logAudit('account',next === 'Đã khóa' ? 'Khóa tài khoản' : 'Mở tài khoản',account().id); closeModal(); render(); showToast('Đã cập nhật trạng thái tài khoản.'); return; }
      const userStatus = event.target.closest('[data-confirm-user-status]');
      if (userStatus) { const next = userStatus.dataset.confirmUserStatus; user().status = next; logAudit('account',next === 'Ngừng dùng' ? 'Ngừng người dùng' : 'Dùng lại người dùng',user().id); closeModal(); render(); showToast('Đã cập nhật trạng thái người dùng.'); return; }
      const groupStatus = event.target.closest('[data-confirm-group-status]');
      if (groupStatus) { const next = groupStatus.dataset.confirmGroupStatus; group().status = next; logAudit('account',next === 'Ngừng dùng' ? 'Ngừng nhóm quyền' : 'Dùng lại nhóm quyền',group().id); closeModal(); render(); showToast('Đã cập nhật trạng thái nhóm.'); }
    });

    function filterUsers() {
      const query = document.getElementById('user-search').value.trim().toLowerCase(); const status = document.getElementById('user-status').value;
      const list = users.filter((item) => (status === 'Tất cả' || item.status === status) && (!query || [item.id,item.name,item.department].some((value) => value.toLowerCase().includes(query))));
      document.getElementById('user-rows').innerHTML = userRows(list);
    }
    function filterAccounts() {
      const query = document.getElementById('account-search').value.trim().toLowerCase(); const status = document.getElementById('account-status').value;
      const list = accounts.filter((item) => { const owner = userById(item.userId); return (status === 'Tất cả' || item.status === status) && (!query || [item.id,item.method,owner?.id,owner?.name,owner?.department].filter(Boolean).some((value) => value.toLowerCase().includes(query))); });
      document.getElementById('account-rows').innerHTML = accountRows(list);
    }
    document.addEventListener('change', (event) => {
      if (event.target.id === 'actor-select') { state.actor = event.target.value; state.page = state.actor === 'pdm' ? 'policies' : 'users'; state.draft = null; render(); return; }
      if (event.target.id === 'policy-group') {
        if (state.draft) { showToast('Kích hoạt hoặc bỏ bản nháp trước khi đổi nhóm.'); render(); return; }
        state.selectedGroup = event.target.value; render(); return;
      }
      if (event.target.id === 'policy-type') {
        if (state.draft) { showToast('Kích hoạt hoặc bỏ bản nháp trước khi đổi loại tài liệu.'); render(); return; }
        state.selectedType = event.target.value; render(); return;
      }
      if (event.target.matches('[data-policy-state]')) { state.draft.matrix[event.target.dataset.policyState][Number(event.target.dataset.policyAction)] = event.target.checked ? 1 : 0; render(); return; }
      if (event.target.id === 'effective-user' || event.target.id === 'assignment-user') { state.selectedUser = event.target.value; const linked = accountForUser(state.selectedUser); if (linked) state.selectedAccount = linked.id; render(); return; }
      if (event.target.id === 'effective-type') state.selectedType = event.target.value;
      else if (event.target.id === 'effective-state') state.selectedState = event.target.value;
      else if (event.target.id === 'effective-action') state.selectedAction = event.target.value;
      else if (event.target.id === 'user-status') { filterUsers(); return; }
      else if (event.target.id === 'account-status') { filterAccounts(); return; }
      else return;
      render();
    });
    document.addEventListener('input', (event) => {
      if (event.target.id === 'user-search') filterUsers();
      if (event.target.id === 'account-search') filterAccounts();
    });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !document.getElementById('modal-backdrop').hidden) closeModal(); });
    document.getElementById('modal-backdrop').addEventListener('click', (event) => { if (event.target.id === 'modal-backdrop') closeModal(); });

    render();
  </script>
</body>
</html>
