<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Throwaway UI prototype for the IDEA Engineering controlled document workspace.">
  <title>IDEA Engineering — Controlled Document Workspace (Prototype)</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172433;
      --muted: #607082;
      --soft: #f4f7fa;
      --surface: #ffffff;
      --line: #dbe3ea;
      --line-strong: #c8d4df;
      --navy: #123452;
      --navy-2: #1b496f;
      --blue: #2f78aa;
      --teal: #177c78;
      --green: #217a55;
      --amber: #9a6a13;
      --red: #a13c45;
      --purple: #6d57a4;
      --shadow: 0 16px 44px rgba(24, 48, 73, .11);
      --shadow-soft: 0 5px 18px rgba(24, 48, 73, .07);
      --radius: 14px;
      --radius-sm: 9px;
      --focus: #f3a83b;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #eef3f7; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% -12%, rgba(82, 142, 184, .18), transparent 36rem),
        linear-gradient(180deg, #f3f7fa 0%, #eef3f7 100%);
      font: 14px/1.45 var(--sans);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    a { color: var(--blue); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .app-shell { min-height: 100vh; padding-bottom: 90px; }
    .topbar {
      color: #fff;
      background: linear-gradient(116deg, #102c46 0%, #183e5c 60%, #1b536e 100%);
      border-bottom: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 5px 18px rgba(9, 29, 46, .18);
    }
    .topbar-inner {
      width: min(1560px, calc(100% - 44px));
      min-height: 86px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand-lockup { display: flex; align-items: center; gap: 13px; min-width: 250px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 11px; color: #123452; background: #f7c46b;
      font-weight: 900; letter-spacing: -.08em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
    }
    .brand-name { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; font-weight: 780; }
    .brand-sub { margin: 1px 0 0; color: rgba(255,255,255,.68); font-size: 11px; letter-spacing: .05em; }
    .topbar-controls { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .control-label { display: grid; gap: 2px; color: rgba(255,255,255,.68); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .control-label select {
      min-width: 102px; padding: 7px 28px 7px 10px; border: 1px solid rgba(255,255,255,.26);
      border-radius: 8px; color: #fff; background: rgba(255,255,255,.1);
    }
    .control-label select option { color: var(--ink); background: #fff; }
    .topbar-btn {
      min-height: 35px; padding: 7px 12px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px;
      color: #fff; background: rgba(255,255,255,.1); font-weight: 680;
    }
    .topbar-btn:hover { background: rgba(255,255,255,.18); }
    .topbar-btn.primary { color: #17324b; background: #f5c56d; border-color: #f5c56d; }
    .topbar-btn.primary:hover { background: #ffd98e; }

    .prototype-strip {
      width: min(1560px, calc(100% - 44px)); margin: 18px auto 0; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px; border: 1px solid #e1bd72; border-radius: 10px;
      color: #644d1d; background: #fff8e8; box-shadow: var(--shadow-soft); font-size: 12px;
    }
    .prototype-strip strong { letter-spacing: .04em; text-transform: uppercase; }
    .prototype-strip span { color: #7c6740; }
    .prototype-strip .strip-spacer { flex: 1; }
    .kbd { padding: 2px 6px; border: 1px solid #c7d0d8; border-bottom-width: 2px; border-radius: 5px; color: #526272; background: #f8fafb; font: 11px var(--mono); }

    .page-wrap { width: min(1560px, calc(100% - 44px)); margin: 0 auto; }
    .page-intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 25px 0 18px; }
    .page-intro h1 { margin: 0; color: var(--navy); font-size: clamp(24px, 3vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    .page-intro p { max-width: 730px; margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .intro-aside { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .tiny-note { color: var(--muted); font-size: 11px; }

    .workspace-grid { display: grid; gap: 14px; }
    .panel, .card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-soft);
    }
    .panel { overflow: hidden; }
    .panel-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .panel-header h2, .panel-header h3 { margin: 0; color: var(--navy); font-size: 14px; letter-spacing: -.01em; }
    .panel-header p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .panel-body { padding: 15px 16px; }
    .eyebrow { color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }
    .small { font-size: 11px; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 999px; color: #4d5e70; background: #f7f9fb;
      font-size: 11px; font-weight: 730; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #93a1ad; }
    .badge.navy { color: #1f547d; background: #edf6fc; border-color: #c9e1ef; }
    .badge.navy::before { background: var(--blue); }
    .badge.teal { color: #176862; background: #ecf8f6; border-color: #bfe5df; }
    .badge.teal::before { background: var(--teal); }
    .badge.green { color: #216443; background: #edf8f1; border-color: #c6e8d2; }
    .badge.green::before { background: var(--green); }
    .badge.amber { color: #765618; background: #fff7e7; border-color: #f0d79d; }
    .badge.amber::before { background: #cf921f; }
    .badge.red { color: #813941; background: #fff0f1; border-color: #efc5c8; }
    .badge.red::before { background: var(--red); }
    .badge.purple { color: #5b4989; background: #f4f0ff; border-color: #d9cef3; }
    .badge.purple::before { background: var(--purple); }
    .badge.plain::before { display: none; }

    .doc-title { margin: 2px 0 4px; color: var(--navy); font-size: 20px; line-height: 1.15; letter-spacing: -.025em; }
    .doc-subtitle { margin: 0; color: var(--muted); font-size: 12px; }
    .doc-hero { padding: 18px; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, #fff 0%, #f6fafc 100%); }
    .doc-hero-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .doc-hero-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .identity-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 15px; }
    .identity-cell { min-height: 62px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.82); }
    .identity-cell dt { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; }
    .identity-cell dd { margin: 4px 0 0; color: var(--navy); font-size: 13px; font-weight: 800; overflow-wrap: anywhere; }
    .identity-cell dd.mono { font-size: 12px; }

    .action-bar { padding: 13px 16px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
    .action-bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .action-bar h3 { margin: 0; color: var(--navy); font-size: 12px; }
    .action-groups { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .action-group { display: flex; gap: 6px; flex-wrap: wrap; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--line); }
    .action-group:last-child { padding-right: 0; border-right: 0; }
    .action-btn {
      min-height: 32px; padding: 6px 10px; border: 1px solid #cbd8e2; border-radius: 8px; color: #25465d;
      background: #fff; font-size: 12px; font-weight: 730; transition: .15s ease;
    }
    .action-btn:hover { border-color: #8fb4ca; background: #f2f8fb; transform: translateY(-1px); }
    .action-btn.primary { color: #fff; background: var(--navy-2); border-color: var(--navy-2); }
    .action-btn.primary:hover { background: #236288; }
    .action-btn.edge { color: #7b4f1b; border-color: #e3c27b; background: #fffaf0; }
    .action-btn.danger { color: #873b42; border-color: #e6bcc0; background: #fff7f7; }
    .action-btn.is-disabled { opacity: .55; filter: saturate(.55); }
    .action-btn.is-disabled:hover { transform: none; border-color: #cbd8e2; background: #fff; }
    .reason-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .reason-row label { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .reason-row input { flex: 1; min-width: 180px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; }

    .guided-panel { margin: 14px 16px; border: 1px solid #c9dce7; border-radius: 12px; background: #f5fbfd; overflow: hidden; }
    .guided-head { padding: 12px 13px 9px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .guided-head h3 { margin: 0; color: #1b536b; font-size: 13px; }
    .guided-head p { margin: 3px 0 0; color: #5e7785; font-size: 11px; }
    .guided-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 13px 10px; }
    .guided-tab { flex: 0 0 auto; padding: 6px 9px; border: 1px solid #c9dce7; border-radius: 7px; color: #547182; background: #fff; font-size: 11px; font-weight: 700; }
    .guided-tab[aria-selected="true"] { color: #fff; border-color: var(--teal); background: var(--teal); }
    .guided-progress { height: 4px; margin: 0 13px; border-radius: 99px; background: #dbeaf0; overflow: hidden; }
    .guided-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--teal); transition: width .2s ease; }
    .guided-body { padding: 12px 13px 13px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .guided-step { color: #254d60; font-size: 12px; }
    .guided-step strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .guided-step span { color: #69818c; }
    .guided-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .guide-btn { min-height: 31px; padding: 6px 10px; border: 1px solid #b9d4de; border-radius: 7px; color: #1c6070; background: #fff; font-size: 11px; font-weight: 750; }
    .guide-btn.primary { color: #fff; background: var(--teal); border-color: var(--teal); }
    .guided-message { grid-column: 1 / -1; padding: 7px 9px; border-radius: 7px; color: #5b7180; background: rgba(255,255,255,.75); font-size: 11px; }

    .state-card { padding: 14px 16px; border-top: 1px solid var(--line); background: #fafcfd; }
    .state-card summary { cursor: pointer; color: var(--navy); font-weight: 760; }
    .state-card summary::marker { color: var(--teal); }
    .state-summary { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 8px; }
    .state-json { max-height: 300px; overflow: auto; padding: 11px; border: 1px solid #d9e3ea; border-radius: 8px; color: #28465c; background: #f1f6f8; font: 11px/1.55 var(--mono); white-space: pre-wrap; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 8px 6px; border-bottom: 1px solid #edf1f4; text-align: left; vertical-align: top; }
    .data-table th { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .data-table td { color: #344c5e; font-size: 12px; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table .value { color: var(--navy); font-weight: 750; }

    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 69px 14px 1fr; gap: 8px; min-height: 52px; }
    .timeline-item::before { content: ""; position: absolute; left: 75px; top: 14px; bottom: -4px; width: 1px; background: #dce6ec; }
    .timeline-item:last-child::before { display: none; }
    .timeline-time { color: var(--muted); font: 10px var(--mono); padding-top: 2px; text-align: right; }
    .timeline-dot { z-index: 1; width: 10px; height: 10px; margin-top: 3px; border: 2px solid #fff; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #9bcfc9; }
    .timeline-content strong { display: block; color: var(--navy); font-size: 12px; }
    .timeline-content span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .timeline-content em { display: inline-block; margin-top: 4px; color: #567282; font-size: 10px; font-style: normal; }

    .doc-list { display: grid; gap: 4px; padding: 8px; }
    .doc-list-item { width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 9px; color: var(--ink); background: transparent; text-align: left; }
    .doc-list-item:hover { background: #f1f7fa; }
    .doc-list-item[aria-current="true"] { border-color: #b9d9e4; background: #edf8f8; }
    .doc-list-item strong { display: block; color: var(--navy); font-size: 12px; line-height: 1.25; }
    .doc-list-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .doc-list-item .list-meta { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .list-dot { width: 7px; height: 7px; border-radius: 50%; background: #9eacb5; }
    .list-dot.green { background: var(--green); }
    .list-dot.amber { background: #ca951e; }
    .list-dot.blue, .list-dot.navy { background: var(--blue); }
    .list-dot.red { background: var(--red); }

    .metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .metric { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .metric-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .metric-value { margin-top: 5px; color: var(--navy); font-size: 21px; font-weight: 820; letter-spacing: -.03em; }
    .metric-note { margin-top: 2px; color: var(--muted); font-size: 10px; }

    /* Variant A: explorer */
    .variant-a { display: grid; grid-template-columns: 230px minmax(0, 1fr) 285px; gap: 14px; align-items: start; }
    .variant-a .nav-panel { position: sticky; top: 14px; }
    .nav-panel .nav-section { padding: 13px 13px 7px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-links { display: grid; gap: 3px; padding: 0 8px 10px; }
    .nav-link { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 8px; color: #4e6677; font-size: 12px; font-weight: 650; }
    .nav-link.active { color: #194f6c; background: #eaf5f8; }
    .nav-link .nav-icon { width: 19px; color: #5a8797; text-align: center; font-size: 14px; }
    .variant-a .main-panel { min-width: 0; }
    .variant-a .right-rail { display: grid; gap: 14px; }
    .linked-list { display: grid; gap: 7px; }
    .linked-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 9px; border: 1px solid #edf1f4; border-radius: 8px; background: #fbfcfd; }
    .linked-item strong { color: var(--navy); font-size: 11px; }
    .linked-item span { color: var(--muted); font: 10px var(--mono); }

    /* Variant B: task-first */
    .variant-b { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 14px; align-items: start; }
    .task-panel { position: sticky; top: 14px; }
    .task-list { display: grid; gap: 8px; padding: 13px; }
    .task-item { padding: 11px 12px; border: 1px solid var(--line); border-left: 4px solid #9aaab5; border-radius: 10px; background: #fff; }
    .task-item.priority { border-left-color: #d0962a; }
    .task-item.blocked { border-left-color: var(--red); }
    .task-item.done { border-left-color: var(--green); opacity: .78; }
    .task-item h3 { margin: 0; color: var(--navy); font-size: 12px; }
    .task-item p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .task-item .task-footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; color: #72818c; font-size: 10px; }
    .focus-panel { min-width: 0; }
    .focus-banner { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 13px 16px; border: 1px solid #c9dfe7; border-radius: 12px; background: linear-gradient(110deg, #effafa, #f7fbfc); }
    .focus-banner strong { color: #1d5e6b; font-size: 13px; }
    .focus-banner span { color: #66838d; font-size: 11px; }
    .next-action { margin-top: 14px; padding: 17px; border: 1px solid #d6dfeb; border-radius: var(--radius); background: #fff; box-shadow: var(--shadow-soft); }
    .next-action h2 { margin: 2px 0 5px; color: var(--navy); font-size: 22px; letter-spacing: -.03em; }
    .next-action p { margin: 0; color: var(--muted); }
    .next-action .next-action-cta { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .b-split { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 14px; margin-top: 14px; }
    .b-feed { display: grid; gap: 14px; }
    .b-rail { display: grid; gap: 14px; align-content: start; }

    /* Variant C: lifecycle board */
    .variant-c { display: grid; gap: 14px; }
    .board-toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-soft); }
    .board-toolbar h2 { margin: 0; color: var(--navy); font-size: 14px; }
    .board-toolbar p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .board-toolbar .toolbar-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .board-column { min-height: 430px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.68); overflow: hidden; }
    .board-column-head { padding: 11px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .board-column-head h3 { margin: 0; color: var(--navy); font-size: 12px; }
    .column-count { min-width: 22px; padding: 2px 6px; border-radius: 99px; color: #537185; background: #edf3f6; font: 10px var(--mono); text-align: center; }
    .column-start .board-column-head { border-top: 3px solid #9aaab5; }
    .column-work .board-column-head { border-top: 3px solid var(--blue); }
    .column-review .board-column-head { border-top: 3px solid var(--amber); }
    .column-release .board-column-head { border-top: 3px solid var(--green); }
    .board-cards { display: grid; gap: 8px; padding: 9px; }
    .board-card { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; text-align: left; box-shadow: 0 2px 6px rgba(25, 53, 74, .04); }
    .board-card:hover, .board-card[aria-current="true"] { border-color: #8bbbc8; box-shadow: 0 4px 11px rgba(34, 104, 125, .11); }
    .board-card[aria-current="true"] { background: #f1fbfa; }
    .board-card strong { display: block; color: var(--navy); font-size: 12px; line-height: 1.28; }
    .board-card p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .board-card .board-card-meta { display: flex; justify-content: space-between; gap: 5px; margin-top: 8px; color: #6a7d89; font: 10px var(--mono); }
    .board-empty { padding: 16px 10px; color: #83939d; font-size: 11px; text-align: center; }
    .c-detail { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; }
    .c-detail-main { min-width: 0; }
    .c-drawer { position: sticky; top: 14px; }

    .empty-state { padding: 30px 20px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--navy); }

    .review-overlay { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(10, 29, 45, .56); }
    .review-overlay[hidden] { display: none; }

    .variant-key { color: var(--navy); font-weight: 820; }

    let state = createInitialState();
    let toastTimer = null;

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
    }
    function t(key) { return (I18N[state.locale] && I18N[state.locale][key]) || I18N.en[key] || key; }
    function titleOf(doc) { return (DOC_TITLES[doc.titleKey] && (DOC_TITLES[doc.titleKey][state.locale] || DOC_TITLES[doc.titleKey].en)) || doc.titleKey; }
    function actorOf(id = state.actorId) { return ACTORS[id] || ACTORS.author; }
    function activeDoc() { return state.docs.find(doc => doc.id === state.activeDocId) || state.docs[0]; }
    function ownsReservation(doc = activeDoc()) {
      const actor = actorOf();
      return Boolean(doc.reservation && doc.reservation.owner === state.actorId && doc.reservation.workspace === actor.workspace);
    }
    function maxGeneration() {
      return state.docs.reduce((max, doc) => {
        const match = String(doc.generation || '').match(/(\d+)$/);
        return Math.max(max, match ? Number(match[1]) : 0);
      }, 0);
    }
    function nextGeneration() { return `G-${String(maxGeneration() + 1).padStart(4, '0')}`; }
    function bumpMinor(version) {
      const [major, minor] = String(version || '0.1').split('.').map(Number);
      return `${Number.isFinite(major) ? major : 0}.${(Number.isFinite(minor) ? minor : 0) + 1}`;
    }
    function nextRevision(revision) {
      const code = String(revision || 'A').charCodeAt(0);
      return String.fromCharCode(code >= 90 ? 65 : code + 1);
    }
    function formatClock(minutes) {
      const h = Math.floor(minutes / 60) % 24;
      const m = minutes % 60;
      return `2026-08-28 ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }
    function statusClass(value) {
      if (['Released', 'Approved', 'PASS'].includes(value)) return 'green';
      if (['Under Review', 'Proposed'].includes(value)) return 'amber';
      if (['BLOCKED', 'FAIL'].includes(value)) return 'red';
      if (['In Work'].includes(value)) return 'navy';
      if (['Start', 'Draft', 'NOT-RUN'].includes(value)) return 'plain';
      return 'plain';
    }
    function workflowLabel(value) { return t(({ 'Start': 'start', 'In Work': 'inWork', 'Under Review': 'underReview', 'Released': 'released' })[value] || value); }
    function statusLabel(value) { return t(({ Draft: 'draft', Proposed: 'proposed', Approved: 'approved', Superseded: 'superseded' })[value] || value); }
    function gateLabel(value) { return t(({ 'NOT-RUN': 'notRun', PASS: 'pass', FAIL: 'fail', BLOCKED: 'blocked' })[value] || value); }
    function reservationLabel(doc) {
      if (!doc.reservation) return t('unreserved');
      if (ownsReservation(doc)) return `${t('owned')} · ${doc.reservation.workspace}`;
      return `${doc.reservation.ownerName} · ${doc.reservation.workspace}`;
    }

    function normalizeDoc(seed) {
      return {
        ...clone(seed),
        workingHead: seed.generation,
        workingCopy: { open: false, dirty: false, summary: '' },
        reservation: null,
        pendingReview: seed.workflow === 'Under Review' ? { generation: seed.generation, submittedBy: 'Khoa Phạm', decision: null } : null,
        approvalDecision: null,
        releaseRecord: seed.workflow === 'Released' ? { id: 'REL-000' + seed.versionSequence, generation: seed.generation, actor: 'Minh Trần' } : null,
        conflict: null,
        localWork: null,
        revisionHistory: []

    }
    function createInitialState(overrides = {}) {
      const docs = SEED_DOCS.map(normalizeDoc);
      return {
        locale: overrides.locale || 'vi',
        variant: overrides.variant || readVariant(),
        actorId: overrides.actorId || 'author',
        activeDocId: overrides.activeDocId || 'LD-P100-001',
        docs,
        clock: 8 * 60 + 30,
        audit: [{ time: '2026-08-28 08:30', type: 'Registered', actor: 'System', docId: 'LD-P100-001', detail: 'Logical Document registered; Revision A starts without Generation.' }],
        guided: { scenario: overrides.scenario || 'happy', step: 0, completed: {}, message: '' },
        draftReason: 'Bổ sung evidence và làm rõ acceptance path',
        lastAction: { type: 'info', message: 'Demo state ready.' },

    }
    function readVariant() {

    }
    function resetData({ keepGuide = false } = {}) {

      const next = createInitialState({ locale: previous.locale, variant: previous.variant, activeDocId: 'LD-P100-001', scenario: previous.guided.scenario });
      if (keepGuide) next.guided = { scenario: previous.guided.scenario, step: 0, completed: previous.guided.completed, message: '' };
      state = next;
    }
    function tick() { state.clock += 3; return formatClock(state.clock); }
    function audit(type, detail, doc = activeDoc(), actorName = actorOf().name) {
      state.audit.unshift({ time: tick(), type, actor: actorName, docId: doc && doc.id, detail });
      if (state.audit.length > 30) state.audit.length = 30;
    }
    function success(message) { return { ok: true, message }; }
    function blocked(message, code = 'BLOCKED') { return { ok: false, code, message }; }
    function canAction(action, doc = activeDoc()) {
      const actor = actorOf();
      const hasOwner = ownsReservation(doc);
      const prototypeMutations = ['reserve', 'open', 'edit', 'publish', 'submit', 'approve', 'reject', 'release', 'create-revision', 'external-advance', 'refresh', 'recover', 'withdraw'];
      if (doc.id !== 'LD-P100-001' && prototypeMutations.includes(action)) {
        return blocked('Context record này chỉ để tạo mật độ UI. Chọn LD-P100-001 để chạy full interaction.');
      }
      switch (action) {
        case 'reserve':
          if (actor.kind === 'observer') return blocked('Read-only Observer không thể Reserve.');
          if (doc.workflow === 'Released') return blocked('Released Revision là immutable; dùng Create Revision.');
          if (doc.reservation && !hasOwner) return blocked(`Reservation đang thuộc ${doc.reservation.ownerName} tại ${doc.reservation.workspace}.`);
          return success('');
        case 'open':
          if (!hasOwner) return blocked('Cần Reservation đúng owner và Workspace trước khi mở working copy.');
          if (doc.workflow === 'Released') return blocked('Không mở chỉnh sửa trực tiếp trên Released Revision.');
          return success('');
        case 'edit':
          if (actor.kind !== 'author') return blocked('Chỉ Author / Editor được sửa working copy trong seeded policy.');
          if (!hasOwner) return blocked('Cần Reservation đúng owner và Workspace.');
          if (!doc.workingCopy.open) return blocked('Hãy Open working copy trước.');
          return success('');
        case 'publish':
          if (actor.kind !== 'author') return blocked('Publish yêu cầu Author / Editor của working copy.');
          if (!hasOwner) return blocked('Publish bị chặn: Reservation không thuộc actor/workspace hiện tại.');
          if (!doc.workingCopy.open) return blocked('Hãy Open working copy trước khi Publish.');
          if (doc.conflict) return blocked(`Stale Generation: expected ${doc.conflict.expected}, current ${doc.conflict.current}. Hãy Refresh / reapply.`);
          if (doc.workflow !== 'Start' && !doc.workingCopy.dirty) return success('');
          return success('');
        case 'submit':
          if (actor.kind !== 'author') return blocked('Chỉ Author / Editor được Submit for review.');
          if (!hasOwner) return blocked('Submit yêu cầu Reservation hiện tại.');
          if (!doc.generation) return blocked('Chưa có Generation để pin vào review.');
          if (doc.workingCopy.dirty) return blocked('Còn local changes chưa Publish.');
          if (doc.workflow !== 'In Work') return blocked(`Submit chỉ hợp lệ từ In Work; hiện tại là ${workflowLabel(doc.workflow)}.`);
          return success('');
        case 'approve':
          if (actor.kind !== 'approver') return blocked('Approval Policy yêu cầu Independent Approver.');
          if (!doc.pendingReview) return blocked('Chưa có pending review.');
          if (doc.pendingReview.submittedBy === actor.name) return blocked('Không được tự approve revision do chính mình submit.');
          if (doc.pendingReview.generation !== doc.generation) return blocked('Pending review đã stale vì Generation thay đổi.');
          return success('');
        case 'reject':
          if (actor.kind !== 'approver') return blocked('Reject yêu cầu Independent Approver.');
          if (!doc.pendingReview) return blocked('Chưa có pending review.');
          if (!String(state.draftReason).trim()) return blocked('Reject bắt buộc có reason.');
          return success('');
        case 'release':
          if (actor.kind !== 'approver') return blocked('Release yêu cầu actor đủ quyền release.');
          if (!doc.pendingReview || !doc.approvalDecision) return blocked('Cần Approval Decision trên exact Generation trước khi Release.');
          if (doc.pendingReview.generation !== doc.generation) return blocked('Không Release được: pending Generation không còn là Working Head.');
          return success('');
        case 'create-revision':
          if (actor.kind === 'observer') return blocked('Read-only Observer không thể Create Revision.');
          if (doc.workflow !== 'Released') return blocked('Create Revision chỉ bắt đầu từ Released baseline.');
          return success('');
        case 'external-advance':
          if (!doc.generation) return blocked('Cần Generation trước khi mô phỏng external advance.');
          return success('');
        case 'refresh':
          if (!doc.conflict) return blocked('Hiện không có stale conflict cần refresh.');

        case 'recover':

    }

    function dispatch(action, payload = {}) {
      const doc = activeDoc();
      let check;
      if (!['reset', 'switch-actor', 'select-doc', 'guided-select', 'guided-reset', 'open-review', 'close-review', 'save-review', 'print-review', 'copy-review', 'guided-next'].includes(action)) {
        check = canAction(action, doc);
        if (!check.ok) { state.lastAction = { type: 'blocked', message: check.message, code: check.code }; return check; }
      }
      let result = success('');
      const actor = actorOf();

      switch (action) {
        case 'reset':
          resetData();
          result = success('Demo state đã reset; mọi thay đổi trước đó chỉ là in-memory.');
          break;
        case 'select-doc':
          if (state.docs.some(item => item.id === payload.id)) {
            state.activeDocId = payload.id;
            result = success(`Đã chọn ${payload.id}.`);
          } else result = blocked('Không tìm thấy document synthetic này.');
          break;
        case 'switch-actor':
          if (ACTORS[payload.actorId]) {
            state.actorId = payload.actorId;

          } else result = blocked('Actor không hợp lệ.');

            audit('Reserved', `Reservation bound to ${doc.id}; expected Generation ${doc.generation || '∅'}.`);
            result = success(`Reserved ${doc.id} cho ${actor.workspace}.`);
          }
          break;
        case 'open':
          doc.workingCopy.open = true;
          doc.workingCopy.summary = doc.localWork ? 'Reopened preserved local work after reject.' : 'Working copy opened from current Working Head.';
          audit('WorkingCopyOpened', doc.workingCopy.summary);
          result = success('Working copy đã mở; chưa tạo Generation mới.');
          break;
        case 'edit':
          doc.workingCopy.dirty = true;
          doc.workingCopy.summary = doc.localWork ? 'Local work re-applied; metadata delta pending.' : 'Metadata delta pending publish.';
          doc.localWork = { preserved: Boolean(doc.localWork && doc.localWork.preserved), summary: doc.workingCopy.summary, sourceGeneration: doc.generation };

            result = blocked(`Stale Generation: expected ${doc.conflict.expected}, current ${doc.conflict.current}. Local work được giữ.`, 'STALE_GENERATION');

          doc.status = 'Proposed';
          doc.gate = 'NOT-RUN';

          doc.status = 'Approved';

          break;
        case 'reject':
          doc.localWork = { preserved: true, summary: 'Rejected review local work retained for rework.', sourceGeneration: doc.generation, reason: state.draftReason };
          doc.pendingReview = null;
          doc.approvalDecision = null;
          doc.workflow = 'In Work';
          doc.status = 'Draft';
          doc.gate = 'FAIL';

        case 'guided-select':
          if (SCENARIOS[payload.scenario]) {
            state.guided.scenario = payload.scenario;
            state.guided.step = 0;
            state.guided.message = '';
            resetData({ keepGuide: true });
            result = success(`Scenario: ${t(SCENARIOS[payload.scenario].titleKey)}.`);
          } else result = blocked('Scenario không hợp lệ.');
          break;
        case 'guided-reset':
          resetData({ keepGuide: true });
          result = success('Scenario đã reset.');
          break;
        case 'open-review': state.review.open = true; result = success(''); break;
        case 'close-review': state.review.open = false; result = success(''); break;
        case 'save-review':
          state.review.chosenVariant = payload.chosenVariant || state.review.chosenVariant;
          state.review.notes = payload.notes ?? state.review.notes;
          state.review.questions = payload.questions ?? state.review.questions;
          state.review.saved = true;
          state.review.savedAt = formatClock(state.clock);
          result = success(t('verdictSaved'));
          break;
        default: result = success('');
      }
      state.lastAction = { type: result.ok ? 'success' : 'blocked', message: result.message, code: result.code || '' };
      return result;
    }

    function renderApp() {
      const doc = activeDoc();
      let variant = state.variant === 'A' ? renderVariantA(doc) : state.variant === 'B' ? renderVariantB(doc) : renderVariantC(doc);
      return `${renderHeader()}${renderPrototypeStrip()}<main class="page-wrap">${renderPageIntro()}${variant}</main>${renderVariantSwitcher()}${renderReviewPanel()}`;
    }
    function renderVariantSwitcher() {
      const item = VARIANTS[state.variant];
      return `<nav class="variant-switcher" aria-label="Prototype variants"><button type="button" class="switcher-arrow" data-action="previous-variant" aria-label="Previous variant">←</button><div class="switcher-label"><strong>${esc(t('variant'))} ${state.variant} · ${esc(item.name)}</strong><span>${esc(item.promise)}</span></div><button type="button" class="switcher-arrow" data-action="next-variant" aria-label="Next variant">→</button></nav>`;
    }
    function render() {
      document.documentElement.lang = state.locale;
      document.getElementById('root').innerHTML = renderApp();
    }
    function showToast(message, isError = false) {
      const node = document.getElementById('toast');
      node.textContent = message || '';
      node.className = `toast show${isError ? ' error' : ''}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.className = 'toast'; }, 3800);
    }
    function changeVariant(direction) {
      const keys = Object.keys(VARIANTS);
      const index = keys.indexOf(state.variant);
      state.variant = keys[(index + direction + keys.length) % keys.length];
      const url = new URL(window.location.href);
      url.searchParams.set('variant', state.variant);
      window.history.replaceState({}, '', url);
      render();
    }
    function runGuidedNext() {
      const guide = state.guided;
      const scenario = SCENARIOS[guide.scenario];
      if (!scenario || guide.step >= scenario.steps.length) return;
      const step = scenario.steps[guide.step];
      let result;
      if (step.action === 'prepare-and-publish') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); result = dispatch('publish');
      } else if (step.action === 'prepare-and-submit') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); result = dispatch('submit');
      } else if (step.action === 'prepare-and-release') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); dispatch('submit'); dispatch('switch-actor', { actorId: 'approver' }); dispatch('approve'); result = dispatch('release');
      } else result = dispatch(step.action, step.payload || {});
      const expectedBlocked = Boolean(step.expectBlocked);
      const accepted = expectedBlocked ? !result.ok : result.ok;
      if (accepted) {
        guide.step += 1;
        guide.message = expectedBlocked ? `✓ Expected block: ${result.message}` : `✓ ${result.message}`;
        if (guide.step >= scenario.steps.length) guide.completed[guide.scenario] = true;
      } else guide.message = `Chưa đạt bước này: ${result.message}`;
      state.lastAction = { type: accepted ? 'success' : 'blocked', message: guide.message, code: result.code || '' };
      render();
      showToast(guide.message, !accepted);
    }
    function reviewPayload() {
      return { chosenVariant: document.getElementById('reviewVariant')?.value || state.review.chosenVariant, notes: document.getElementById('reviewNotes')?.value || '', questions: document.getElementById('reviewQuestions')?.value || '' };
    }
    function copyReview() {
      const active = activeDoc();
      const payload = `IDEA Engineering — UI Prototype Review\nVariant: ${state.variant} · ${VARIANTS[state.variant].name}\nActive document: ${active.id} / Revision ${active.revision} / Generation ${active.generation || '∅'}\nActor: ${actorOf().name} · ${actorOf().role}\nDecision: ${state.review.notes || t('noVerdict')}\nOpen questions: ${state.review.questions || '—'}`;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(() => showToast('Summary đã copy vào clipboard.')).catch(() => showToast(payload));
      else showToast(payload);
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'previous-variant') return changeVariant(-1);
      if (action === 'next-variant') return changeVariant(1);
      if (action === 'select-doc') {
        const result = dispatch('select-doc', { id: button.dataset.docId }); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-select') {
        const result = dispatch('guided-select', { scenario: button.dataset.scenario }); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-reset') {
        const result = dispatch('guided-reset'); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-next') return runGuidedNext();
      if (action === 'open-review') {
        state.review.open = true; render(); document.querySelector('.review-dialog')?.querySelector('select, textarea, button')?.focus(); return;
      }
      if (action === 'close-review') { state.review.open = false; render(); return; }
      if (action === 'save-review') { const result = dispatch('save-review', reviewPayload()); render(); showToast(result.message, !result.ok); return; }
      if (action === 'print-review') { window.print(); return; }
      if (action === 'copy-review') { copyReview(); return; }
      if (action === 'reset') { const result = dispatch('reset'); render(); showToast(result.message, !result.ok); return; }
      if (button.getAttribute('aria-disabled') === 'true') { showToast(button.title, true); return; }
      const result = dispatch(action);
      render();
      if (result.message) showToast(result.message, !result.ok);
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'localeSelect') { state.locale = event.target.value; render(); return; }
      if (event.target.id === 'actorSelect') { const result = dispatch('switch-actor', { actorId: event.target.value }); render(); showToast(result.message, !result.ok); }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'reasonInput') state.draftReason = event.target.value;
      if (event.target.id === 'reviewNotes') state.review.notes = event.target.value;
      if (event.target.id === 'reviewQuestions') state.review.questions = event.target.value;
    });
    document.addEventListener('keydown', event => {
      const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target?.isContentEditable) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); changeVariant(-1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); changeVariant(1); }
      if (event.key === 'Escape' && state.review.open) { state.review.open = false; render(); }
    });
    window.addEventListener('popstate', () => { state.variant = readVariant(); render(); });
    render();
  </script>
</body>
</html>
