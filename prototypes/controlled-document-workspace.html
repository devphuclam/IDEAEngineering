<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Throwaway UI prototype for the IDEA Engineering controlled document workspace.">
  <title>IDEA Engineering — Controlled Document Workspace (Prototype)</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0F172A;
      --muted: #475569;
      --soft: #F1F2F3;
      --surface: #ffffff;
      --line: #E2E8F0;
      --line-strong: #CBD5E1;
      --navy: #0F172A;
      --navy-2: #1E293B;
      --blue: #2563EB;
      --teal: #0369A1;
      --green: #15803D;
      --amber: #A16207;
      --red: #DC2626;
      --purple: #6D28D9;
      --shadow: 0 16px 44px rgba(15, 23, 42, .11);
      --shadow-soft: 0 5px 18px rgba(15, 23, 42, .07);
      --radius: 14px;
      --radius-sm: 9px;
      --focus: #B45309;
      --mono: "Fira Code", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Fira Sans", "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: #F8FAFC; scroll-padding-top: 108px; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% -12%, rgba(37, 99, 235, .11), transparent 36rem),
        linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%);
      font: 16px/1.5 var(--sans);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button, input, select, textarea { border-radius: 8px; }
    button { -webkit-tap-highlight-color: transparent; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    a { color: var(--blue); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .app-shell { min-height: 100vh; padding-bottom: 90px; }
    .topbar {
      color: #fff;
      background: linear-gradient(116deg, #0F172A 0%, #1E293B 62%, #334155 100%);
      border-bottom: 1px solid rgba(255,255,255,.13);
      box-shadow: 0 5px 18px rgba(9, 29, 46, .18);
    }
    .topbar-inner {
      width: min(1560px, calc(100% - 44px));
      min-height: 86px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand-lockup { display: flex; align-items: center; gap: 13px; min-width: 250px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 11px; color: #123452; background: #f7c46b;
      font-weight: 900; letter-spacing: -.08em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
    }
    .brand-name { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; font-weight: 780; }
    .brand-sub { margin: 1px 0 0; color: rgba(255,255,255,.68); font-size: 11px; letter-spacing: .05em; }
    .topbar-controls { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .control-label { display: grid; gap: 2px; color: rgba(255,255,255,.68); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .control-label select {
      min-width: 102px; padding: 7px 28px 7px 10px; border: 1px solid rgba(255,255,255,.26);
      border-radius: 8px; color: #fff; background: rgba(255,255,255,.1);
    }
    .control-label select option { color: var(--ink); background: #fff; }
    .topbar-btn {
      min-height: 44px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.28); border-radius: 8px;
      color: #fff; background: rgba(255,255,255,.1); font-weight: 680;
    }
    .topbar-btn:hover { background: rgba(255,255,255,.18); }
    .topbar-btn.primary { color: #17324b; background: #f5c56d; border-color: #f5c56d; }
    .topbar-btn.primary:hover { background: #ffd98e; }

    .prototype-strip {
      width: min(1560px, calc(100% - 44px)); margin: 18px auto 0; padding: 10px 14px;
      display: flex; align-items: center; gap: 10px; border: 1px solid #e1bd72; border-radius: 10px;
      color: #644d1d; background: #fff8e8; box-shadow: var(--shadow-soft); font-size: 12px;
    }
    .prototype-strip strong { letter-spacing: .04em; text-transform: uppercase; }
    .prototype-strip span { color: #7c6740; }
    .prototype-strip .strip-spacer { flex: 1; }
    .direction-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border: 1px solid #D7E2EA; border-radius: 999px; color: #334155 !important; background: #fff; font-size: 11px; font-weight: 720; }
    .direction-pill svg { width: 14px; height: 14px; color: var(--blue); }
    .kbd { padding: 2px 6px; border: 1px solid #c7d0d8; border-bottom-width: 2px; border-radius: 5px; color: #526272; background: #f8fafb; font: 11px var(--mono); }

    .page-wrap { width: min(1560px, calc(100% - 44px)); margin: 0 auto; }
    .page-intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 25px 0 18px; }
    .page-intro > div { min-width: 0; }
    .page-intro h1 { margin: 0; color: var(--navy); font-size: clamp(24px, 3vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    .page-intro p { max-width: 730px; margin: 8px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .intro-aside { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .tiny-note { color: var(--muted); font-size: 11px; }
    .principle-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .principle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid #DCE6EE; border-radius: 7px; color: #334155; background: rgba(255,255,255,.7); font-size: 11px; font-weight: 680; }
    .principle b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: #fff; background: var(--blue); font: 10px var(--mono); }

    .workspace-grid { display: grid; gap: 14px; }
    .panel, .card {
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-soft);
    }
    .panel { overflow: hidden; }
    .panel-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .panel-header h2, .panel-header h3 { margin: 0; color: var(--navy); font-size: 14px; letter-spacing: -.01em; }
    .panel-header p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .panel-body { padding: 15px 16px; }
    .eyebrow { color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }
    .small { font-size: 11px; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: 999px; color: #4d5e70; background: #f7f9fb;
      font-size: 11px; font-weight: 730; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #93a1ad; }
    .badge.navy { color: #1f547d; background: #edf6fc; border-color: #c9e1ef; }
    .badge.navy::before { background: var(--blue); }
    .badge.teal { color: #176862; background: #ecf8f6; border-color: #bfe5df; }
    .badge.teal::before { background: var(--teal); }
    .badge.green { color: #216443; background: #edf8f1; border-color: #c6e8d2; }
    .badge.green::before { background: var(--green); }
    .badge.amber { color: #765618; background: #fff7e7; border-color: #f0d79d; }
    .badge.amber::before { background: #cf921f; }
    .badge.red { color: #813941; background: #fff0f1; border-color: #efc5c8; }
    .badge.red::before { background: var(--red); }
    .badge.purple { color: #5b4989; background: #f4f0ff; border-color: #d9cef3; }
    .badge.purple::before { background: var(--purple); }
    .badge.plain::before { display: none; }

    .doc-title { margin: 2px 0 4px; color: var(--navy); font-size: 20px; line-height: 1.15; letter-spacing: -.025em; }
    .doc-subtitle { margin: 0; color: var(--muted); font-size: 12px; }
    .doc-hero { padding: 18px; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, #fff 0%, #f6fafc 100%); }
    .doc-hero-top { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .doc-hero-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .identity-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 15px; }
    .identity-cell { min-height: 62px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.82); }
    .identity-cell dt { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .045em; text-transform: uppercase; }
    .identity-cell dd { margin: 4px 0 0; color: var(--navy); font-size: 13px; font-weight: 800; overflow-wrap: anywhere; }
    .identity-cell dd.mono { font-size: 12px; }

    .action-bar { padding: 13px 16px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
    .action-bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .action-bar h3 { margin: 0; color: var(--navy); font-size: 12px; }
    .action-groups { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .action-group { display: flex; gap: 6px; flex-wrap: wrap; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--line); }
    .action-group:last-child { padding-right: 0; border-right: 0; }
    .action-btn {
      min-height: 44px; padding: 8px 12px; border: 1px solid #CBD5E1; border-radius: 8px; color: #1E3A5F;
      background: #fff; font-size: 12px; font-weight: 730; transition: .15s ease;
    }
    .action-btn:hover { border-color: #8fb4ca; background: #f2f8fb; transform: translateY(-1px); }
    .action-btn.primary { color: #fff; background: var(--navy-2); border-color: var(--navy-2); }
    .action-btn.primary:hover { background: #236288; }
    .action-btn.edge { color: #7b4f1b; border-color: #e3c27b; background: #fffaf0; }
    .action-btn.danger { color: #873b42; border-color: #e6bcc0; background: #fff7f7; }
    .action-btn.is-disabled { opacity: .55; filter: saturate(.55); }
    .action-btn.is-disabled:hover { transform: none; border-color: #cbd8e2; background: #fff; }
    .action-btn svg, .topbar-btn svg, .guide-btn svg, .close-btn svg { width: 16px; height: 16px; vertical-align: -3px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .reason-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .reason-row label { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .reason-row input { flex: 1; min-width: 180px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fff; }

    .guided-panel { margin: 14px 16px; border: 1px solid #c9dce7; border-radius: 12px; background: #f5fbfd; overflow: hidden; }
    .guided-head { padding: 12px 13px 9px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .guided-head h3 { display: flex; align-items: center; gap: 6px; margin: 0; color: #1b536b; font-size: 13px; }
    .section-icon { display: inline-flex; color: currentColor; }
    .section-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .guided-head p { margin: 3px 0 0; color: #5e7785; font-size: 11px; }
    .guided-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 0 13px 10px; }
    .guided-tab { flex: 0 0 auto; min-height: 40px; padding: 7px 10px; border: 1px solid #C9DCE7; border-radius: 7px; color: #547182; background: #fff; font-size: 11px; font-weight: 700; }
    .guided-tab[aria-selected="true"] { color: #fff; border-color: var(--teal); background: var(--teal); }
    .guided-tab .completion-mark { display: inline-flex; margin-left: 4px; vertical-align: -3px; }
    .guided-tab .completion-mark svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .guided-progress { height: 4px; margin: 0 13px; border-radius: 99px; background: #dbeaf0; overflow: hidden; }
    .guided-progress > span { display: block; height: 100%; border-radius: inherit; background: var(--teal); transition: width .2s ease; }
    .guided-body { padding: 12px 13px 13px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .guided-step { color: #254d60; font-size: 12px; }
    .guided-step strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .guided-step span { color: #69818c; }
    .guided-controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .guide-btn { min-height: 44px; padding: 8px 12px; border: 1px solid #B9D4DE; border-radius: 7px; color: #1C6070; background: #fff; font-size: 11px; font-weight: 750; }
    .guide-btn.primary { color: #fff; background: var(--teal); border-color: var(--teal); }
    .guided-message { grid-column: 1 / -1; padding: 7px 9px; border-radius: 7px; color: #5b7180; background: rgba(255,255,255,.75); font-size: 11px; }

    .state-card { padding: 14px 16px; border-top: 1px solid var(--line); background: #fafcfd; }
    .state-card summary { cursor: pointer; color: var(--navy); font-weight: 760; }
    .state-card summary::marker { color: var(--teal); }
    .state-summary { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 8px; }
    .state-json { max-height: 300px; overflow: auto; padding: 11px; border: 1px solid #d9e3ea; border-radius: 8px; color: #28465c; background: #f1f6f8; font: 11px/1.55 var(--mono); white-space: pre-wrap; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 8px 6px; border-bottom: 1px solid #edf1f4; text-align: left; vertical-align: top; }
    .data-table th { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .data-table td { color: #344c5e; font-size: 12px; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table .value { color: var(--navy); font-weight: 750; }

    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; display: grid; grid-template-columns: 69px 14px 1fr; gap: 8px; min-height: 52px; }
    .timeline-item::before { content: ""; position: absolute; left: 75px; top: 14px; bottom: -4px; width: 1px; background: #dce6ec; }
    .timeline-item:last-child::before { display: none; }
    .timeline-time { color: var(--muted); font: 10px var(--mono); padding-top: 2px; text-align: right; }
    .timeline-dot { z-index: 1; width: 10px; height: 10px; margin-top: 3px; border: 2px solid #fff; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #9bcfc9; }
    .timeline-content strong { display: block; color: var(--navy); font-size: 12px; }
    .timeline-content span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .timeline-content em { display: inline-block; margin-top: 4px; color: #567282; font-size: 10px; font-style: normal; }

    .doc-list { display: grid; gap: 4px; padding: 8px; }
    .doc-list-item { width: 100%; min-height: 52px; padding: 10px; border: 1px solid transparent; border-radius: 9px; color: var(--ink); background: transparent; text-align: left; }
    .doc-list-item:hover { background: #f1f7fa; }
    .doc-list-item[aria-current="true"] { border-color: #b9d9e4; background: #edf8f8; }
    .doc-list-item strong { display: block; color: var(--navy); font-size: 12px; line-height: 1.25; }
    .doc-list-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .doc-list-item .list-meta { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .list-dot { width: 7px; height: 7px; border-radius: 50%; background: #9eacb5; }
    .list-dot.green { background: var(--green); }
    .list-dot.amber { background: #ca951e; }
    .list-dot.blue, .list-dot.navy { background: var(--blue); }
    .list-dot.red { background: var(--red); }

    .metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .metric { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .metric-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .metric-value { margin-top: 5px; color: var(--navy); font-size: 21px; font-weight: 820; letter-spacing: -.03em; }
    .metric-note { margin-top: 2px; color: var(--muted); font-size: 10px; }

    /* Object-centric Engineering Explorer */
    .explorer-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) 285px; gap: 14px; align-items: start; }
    .explorer-layout .nav-panel { position: sticky; top: 14px; }
    .nav-panel .nav-section { padding: 13px 13px 7px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-links { display: grid; gap: 3px; padding: 0 8px 10px; }
    .nav-link { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 9px; border-radius: 8px; color: #334155; font-size: 12px; font-weight: 650; }
    .nav-link.active { color: #194f6c; background: #eaf5f8; }
    .nav-link .nav-icon { width: 19px; height: 19px; display: inline-grid; place-items: center; color: #2563EB; text-align: center; }
    .nav-link .nav-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .explorer-layout .main-panel { min-width: 0; }
    .explorer-layout .right-rail { display: grid; gap: 14px; }
    .linked-list { display: grid; gap: 7px; }
    .linked-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 44px; padding: 8px 9px; border: 1px solid #EDF1F4; border-radius: 8px; background: #FBFCFD; }
    .linked-item strong { color: var(--navy); font-size: 11px; }
    .linked-item span { color: var(--muted); font: 10px var(--mono); }

    /* PLM item-workspace composition: command chrome, navigator, item form and relationships. */
    .app-menu-row { border-top: 1px solid rgba(255,255,255,.08); background: rgba(3, 13, 25, .28); }
    .app-menu { width: min(1560px, calc(100% - 44px)); min-height: 38px; margin: 0 auto; display: flex; align-items: center; gap: 2px; overflow-x: auto; }
    .app-menu-item { min-height: 34px; padding: 5px 12px; border: 0; border-radius: 5px; color: rgba(255,255,255,.78); background: transparent; font-size: 11px; font-weight: 680; white-space: nowrap; }
    .app-menu-item:hover, .app-menu-item:focus-visible { color: #fff; background: rgba(255,255,255,.12); }
    .context-bar { display: flex; align-items: center; gap: 7px; min-height: 42px; margin-bottom: 10px; padding: 6px 9px; border: 1px solid #d6e0e7; border-radius: 8px; color: #496173; background: #eef3f6; box-shadow: 0 2px 8px rgba(15,23,42,.04); }
    .page-intro { align-items: center; padding: 17px 0 12px; }
    .page-intro h1 { font-size: clamp(21px, 2.2vw, 28px); letter-spacing: -.025em; }
    .page-intro p { margin-top: 5px; font-size: 12px; }
    .topbar { color: var(--navy); background: #fff; border-bottom: 1px solid #dce5ea; box-shadow: 0 2px 10px rgba(15,23,42,.06); }
    .topbar-inner { min-height: 64px; }
    .brand-mark { color: #fff; background: var(--blue); box-shadow: inset 0 -3px 0 rgba(0,0,0,.14); }
    .brand-sub { color: #718896; }
    .control-label { color: #718896; }
    .control-label select { color: var(--navy); border-color: #cbd9e1; background: #f7fafb; }
    .control-label select option { color: var(--ink); background: #fff; }
    .topbar-btn { color: #29465c; border-color: #cbd9e1; background: #fff; }
    .topbar-btn:hover { color: #154f6d; border-color: #8fb4ca; background: #f2f8fb; }
    .topbar-btn.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    .topbar-btn.primary:hover { color: #fff; background: #1d4ed8; }
    .app-menu-row { border-top: 0; border-bottom: 1px solid #e2e8ee; background: #f5f8fa; }
    .app-menu-item { color: #496173; }
    .app-menu-item:hover, .app-menu-item:focus-visible { color: #124d6d; background: #e7f1f5; }
    .connection-card { display: flex; align-items: center; gap: 9px; min-width: 235px; padding: 8px 11px; border: 1px solid #d6e0e7; border-radius: 8px; background: #fff; box-shadow: 0 3px 12px rgba(15,23,42,.05); }
    .connection-card .connection-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: #16a34a; font-weight: 900; }
    .connection-card strong { display: block; color: var(--navy); font-size: 11px; }
    .connection-card span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }

      return `<div class="page-intro"><div><div class="eyebrow">${esc(t('workspace'))}</div><h1>${esc(t('workspace'))}</h1><p>${esc(t('intro'))} Đây là một prototype tương tác để review với sếp; state và action chỉ là mô phỏng.</p></div><div class="intro-aside"><div class="connection-card"><span class="connection-mark" aria-hidden="true">✓</span><div><strong>Connected workspace</strong><span>${esc(actor.workspace)} · ${esc(actor.name)}</span></div></div><div class="badge-row">${chip(active.workflow, workflowLabel(active.workflow))}${chip(active.status, statusLabel(active.status))}${chip(active.gate, gateLabel(active.gate))}</div><span class="tiny-note">${esc(t('synthetic'))} · 10 records</span></div></div>`;
    }

    function renderIdentity(doc) {
      const cells = [
        [t('stableId'), doc.id, true], [t('documentClass'), doc.className, false], [t('revision'), doc.revision, false], [t('version'), doc.documentVersion, true], [t('sequence'), doc.versionSequence || '—', true], [t('generation'), doc.generation || '—', true]
      ];
      return `<dl class="identity-grid">${cells.map(([label, value, mono]) => `<div class="identity-cell"><dt>${esc(label)}</dt><dd class="${mono ? 'mono' : ''}">${esc(value)}</dd></div>`).join('')}</dl>`;
    }

    function renderDocHero(doc, includeActions = true) {
      return `<section class="doc-hero" aria-labelledby="item-title"><div class="doc-hero-top"><div><div class="eyebrow">${esc(ui('item'))} · ${esc(doc.category)} · ${esc(doc.className)}</div><h2 id="item-title" class="doc-title">${esc(titleOf(doc))}</h2><p class="doc-subtitle"><span class="mono">${esc(doc.id)}</span> · ${esc(doc.note)}</p></div>${includeActions ? `<div class="doc-hero-actions"><span class="badge navy">${esc(ui('revisionShort'))} ${esc(doc.revision)}</span><span class="badge teal">${esc(ui('generationShort'))} ${esc(doc.generation || '—')}</span>${chip(doc.workflow, workflowLabel(doc.workflow))}${chip(doc.status, statusLabel(doc.status))}</div>` : ''}</div>${renderIdentity(doc)}</section>`;
    }

    function renderActionBar(doc) {
      const reservation = chip(doc.reservation ? (ownsReservation(doc) ? 'owned' : 'external') : 'none', reservationLabel(doc), doc.reservation ? (ownsReservation(doc) ? 'teal' : 'amber') : 'plain');
      const preserved = doc.localWork && doc.localWork.preserved ? chip('local', t('localPreserved'), 'purple') : '';
      return `<section class="action-bar command-bar" aria-labelledby="command-title"><div class="command-toolbar"><span id="command-title" class="command-caption">${esc(ui('commands'))}</span><div class="action-groups"><div class="action-group">${actionButton('reserve', 'reserve', 'primary', 'reserve')}${actionButton('open', 'open', '', 'file')}${actionButton('edit', 'edit', '', 'edit')}${actionButton('publish', 'publish', 'primary', 'publish')}</div><div class="action-group">${actionButton('submit', 'submit', '', 'arrow')}${actionButton('approve', 'approve', '', 'check')}${actionButton('reject', 'reject', 'danger', 'close')}${actionButton('release', 'release', 'primary', 'release')}</div><div class="action-group">${actionButton('create-revision', 'createRevision', '', 'plus')}${actionButton('withdraw', 'withdraw', '', 'back')}</div><div class="action-group">${actionButton('external-advance', 'externalAdvance', 'edge', 'external')}${actionButton('refresh', 'refresh', 'edge', 'refresh')}${actionButton('recover', 'recover', 'edge', 'key')}</div></div></div><div class="command-status"><div class="badge-row">${reservation}${preserved}</div><span class="small muted">${esc(t('actionHint'))}</span></div><div class="reason-row"><label for="reasonInput">${esc(t('reason'))}</label><input id="reasonInput" value="${esc(state.draftReason)}" aria-label="${esc(t('reason'))}"></div></section>`;
    }

    function renderItemTabs() {
      const tabs = [
        ['overview', ui('overview'), 'file'],
        ['files', ui('files'), 'file'],
        ['structure', ui('structure'), 'tree'],
        ['lifecycle', ui('lifecycle'), 'route'],
        ['audit', ui('auditTab'), 'audit']
      ];
      return `<div class="item-tabs" role="tablist" aria-label="${esc(ui('item'))}">${tabs.map(([id, label, icon]) => `<button type="button" class="item-tab" role="tab" aria-selected="${state.activeItemTab === id ? 'true' : 'false'}" aria-controls="item-tab-panel" data-action="item-tab" data-tab="${id}">${svgIcon(icon)} <span>${esc(label)}</span></button>`).join('')}</div>`;
    }

    function renderPropertyForm(doc) {
      const rows = [
        [t('document'), titleOf(doc), false], [t('documentClass'), doc.className, false], [ui('category'), doc.category, false], [ui('ownerShort'), doc.owner, false], [ui('structureShort'), doc.structure, false], [t('gate'), gateLabel(doc.gate), false], [t('reservation'), reservationLabel(doc), false], [ui('workingHead'), doc.workingHead || '—', true], [ui('digestShort'), doc.digest, true]
      ];
      return `<section class="form-section"><div class="form-section-header"><h3>${esc(ui('properties'))}</h3><span>${esc(ui('controlledForm'))}</span></div><dl class="property-grid">${rows.map(([label, value, mono]) => `<div class="property-field"><dt>${esc(label)}</dt><dd class="${mono ? 'mono' : ''}">${esc(value)}</dd></div>`).join('')}</dl></section>`;
    }

    function renderLifecycle(doc) {
      const states = [
        ['Start', ui('startState')],
        ['In Work', ui('inWorkState')],
        ['Under Review', ui('reviewState')],
        ['Released', ui('releasedState')]
      ];
      const currentIndex = Math.max(0, states.findIndex(([value]) => value === doc.workflow));
      return `<section class="form-section"><div class="form-section-header"><h3>${esc(ui('lifecycleMap'))}</h3><span>${esc(workflowLabel(doc.workflow))} · ${esc(statusLabel(doc.status))}</span></div><div class="lifecycle-strip" aria-label="${esc(ui('lifecycle'))}">${states.map(([value, label], index) => `<div class="lifecycle-step ${index < currentIndex ? 'done' : ''} ${index === currentIndex ? 'current' : ''}"><strong>${esc(label)}</strong><span>${index < currentIndex ? 'Complete' : index === currentIndex ? 'Current state' : 'Next state'}</span></div>`).join('')}</div></section>`;
    }

    function relationLabel(item) {
      if (item.category === 'CAD') return 'CAD representation';
      if (item.category === 'Quality') return 'Verification / control';
      if (item.category === 'Release') return 'Release package';
      if (item.category === 'Office') return 'Controlled reference';
      return 'Related document';
    }

    function renderRelationshipGrid(doc) {
      const linkedDocs = doc.linked.map(id => state.docs.find(item => item.id === id)).filter(Boolean);
      return `<section class="form-section relationship-section"><div class="form-section-header"><h3>${esc(ui('relationships'))}</h3><span>${linkedDocs.length} linked item${linkedDocs.length === 1 ? '' : 's'}</span></div>${linkedDocs.length ? `<div class="relationship-table-wrap"><table class="data-table relationship-table"><thead><tr><th>${esc(ui('relation'))}</th><th>${esc(ui('itemId'))}</th><th>${esc(ui('revisionShort'))}</th><th>${esc(ui('generationShort'))}</th><th>${esc(ui('stateShort'))}</th><th>${esc(ui('ownerShort'))}</th></tr></thead><tbody>${linkedDocs.map(item => `<tr><td>${esc(relationLabel(item))}</td><td><button type="button" class="item-link" data-action="select-doc" data-doc-id="${esc(item.id)}">${svgIcon('external')}<span>${esc(item.id)}</span></button><div class="small muted">${esc(titleOf(item))}</div></td><td class="mono">${esc(item.revision)}</td><td class="mono">${esc(item.generation || '—')}</td><td>${chip(item.workflow, workflowLabel(item.workflow))}</td><td>${esc(item.owner)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="tab-empty">${esc(ui('noRelations'))}</div>`}</section>`;
    }

    function renderFileRepresentations(doc) {
      const rows = [
        [ui('nativeFile'), `${doc.id}.source`, doc.workingCopy.open ? 'Workspace' : 'Vault', doc.generation || '—', doc.digest],
        [ui('previewFile'), `${doc.id}.preview.pdf`, 'Derived', doc.generation || '—', 'sha256:preview…'],
        [ui('evidenceFile'), `${doc.id}.release.json`, doc.releaseRecord ? 'Release Record' : 'Pending release', doc.releaseRecord ? doc.releaseRecord.generation : '—', doc.releaseRecord ? 'sha256:release…' : '—']
      ];
      return `<section class="form-section"><div class="form-section-header"><h3>${esc(ui('files'))}</h3><span>${esc(ui('current'))}: ${esc(doc.generation || '—')}</span></div><div class="relationship-table-wrap"><table class="data-table file-table"><thead><tr><th>${esc(ui('fileRole'))}</th><th>${esc(ui('fileName'))}</th><th>${esc(ui('source'))}</th><th>${esc(ui('generationShort'))}</th><th>${esc(ui('digestShort'))}</th></tr></thead><tbody>${rows.map(row => `<tr><td class="role-cell">${esc(row[0])}</td><td>${esc(row[1])}</td><td>${esc(row[2])}</td><td class="mono">${esc(row[3])}</td><td class="mono">${esc(row[4])}</td></tr>`).join('')}</tbody></table></div></section>`;
    }

    function renderItemTabContent(doc) {
      let content;
      switch (state.activeItemTab) {
        case 'files': content = renderFileRepresentations(doc); break;
        case 'structure': content = renderRelationshipGrid(doc); break;
        case 'lifecycle': content = `${renderLifecycle(doc)}${renderAudit(10)}`; break;
        case 'audit': content = renderAudit(14); break;
        default: content = `${renderPropertyForm(doc)}${renderLifecycle(doc)}${renderRelationshipGrid(doc)}`;
      }
      return `<div id="item-tab-panel" class="tab-panel" role="tabpanel">${content}</div>`;
    }

    function renderGuidedPanel() {
      const guide = state.guided;
      const scenario = SCENARIOS[guide.scenario];
      const total = scenario.steps.length;
      const complete = guide.step >= total;
      const step = scenario.steps[Math.min(guide.step, total - 1)];
      const progress = Math.round(Math.min(guide.step, total) / total * 100);
      const tabs = Object.entries(SCENARIOS).map(([id, item]) => `<button type="button" class="guided-tab" role="tab" aria-selected="${guide.scenario === id ? 'true' : 'false'}" data-action="guided-select" data-scenario="${id}">${esc(t(item.titleKey))}${guide.completed[id] ? `<span class="completion-mark" aria-label="${esc(t('complete'))}">${svgIcon('check')}</span>` : ''}</button>`).join('');
      return `<section class="guided-panel" aria-labelledby="guided-title"><div class="guided-head"><div><h3 id="guided-title"><span class="section-icon">${svgIcon('route')}</span>${esc(t('guided'))}</h3><p>${esc(t('guidedHint'))}</p></div><span class="badge ${complete ? 'green' : 'teal'}">${complete ? esc(t('complete')) : `${esc(t('step'))} ${guide.step + 1}/${total}`}</span></div><div class="guided-tabs" role="tablist" aria-label="${esc(t('guided'))}">${tabs}</div><div class="guided-progress" aria-hidden="true"><span style="width:${progress}%"></span></div><div class="guided-body"><div class="guided-step">${complete ? `<strong>${esc(t('complete'))}: ${esc(t(scenario.titleKey))}</strong><span>${esc(scenario.description)}</span>` : `<strong>${esc(step.title)}</strong><span>${esc(step.detail)}</span>`}</div><div class="guided-controls">${complete ? '' : `<button type="button" class="guide-btn primary" data-action="guided-next">${svgIcon('arrow')} <span>${esc(t('runNext'))}</span></button>`}<button type="button" class="guide-btn" data-action="guided-reset">${svgIcon('reset')} <span>${esc(t('restart'))}</span></button></div>${guide.message ? `<div class="guided-message" role="status">${esc(guide.message)}</div>` : ''}</div></section>`;
    }

    function renderMetadata(doc) {
      const rows = [
        [t('workflow'), workflowLabel(doc.workflow)], [t('status'), statusLabel(doc.status)], [t('gate'), gateLabel(doc.gate)], [t('reservation'), reservationLabel(doc)], ['Working Head', doc.workingHead || '—'], ['Digest', doc.digest], ['Structure', doc.structure], ['Owner', doc.owner]
      ];
      return `<section class="panel"><div class="panel-header"><div><h2>${esc(t('metadata'))}</h2><p>Identity, state và exact pin nhìn thấy cùng nhau.</p></div></div><div class="panel-body"><table class="data-table"><tbody>${rows.map(([label, value]) => `<tr><th>${esc(label)}</th><td class="value">${esc(value)}</td></tr>`).join('')}</tbody></table>${doc.baselineFrom ? `<p class="small muted">Baseline from: <span class="mono">${esc(doc.baselineFrom)}</span></p>` : ''}</div></section>`;
    }

    function renderLinked(doc) {
      const linkedDocs = doc.linked.map(id => state.docs.find(item => item.id === id)).filter(Boolean);
      return `<section class="panel"><div class="panel-header"><div><h2>${esc(t('linked'))}</h2><p>Projection để điều hướng; không phải authority thứ hai.</p></div></div><div class="panel-body"><div class="linked-list">${linkedDocs.map(item => `<button type="button" class="linked-item" data-action="select-doc" data-doc-id="${esc(item.id)}"><strong>${esc(titleOf(item))}</strong><span>${esc(item.id)}</span></button>`).join('') || `<div class="empty-state"><strong>${esc(t('none'))}</strong></div>`}</div></div></section>`;
    }

    function renderAudit(limit = 8) {
      return `<section class="panel"><div class="panel-header"><div><h2>${esc(t('audit'))}</h2><p>Attributable demo events; không chỉnh sửa được.</p></div><span class="badge plain">${state.audit.length}</span></div><div class="panel-body"><div class="timeline">${state.audit.slice(0, limit).map(event => `<div class="timeline-item"><div class="timeline-time">${esc(event.time.split(' ')[1] || event.time)}</div><div class="timeline-dot" aria-hidden="true"></div><div class="timeline-content"><strong>${esc(event.type)}</strong><span>${esc(event.actor)} · <span class="mono">${esc(event.docId || 'workspace')}</span></span><em>${esc(event.detail)}</em></div></div>`).join('')}</div></div></section>`;
    }

    function renderStateSnapshot(doc) {
      const snapshot = {
        actor: { id: state.actorId, name: actorOf().name, role: actorOf().role, workspace: actorOf().workspace },
        activeDocument: { id: doc.id, revision: doc.revision, documentVersion: doc.documentVersion, versionSequence: doc.versionSequence, generation: doc.generation, workingHead: doc.workingHead, workflow: doc.workflow, documentStatus: doc.status, gateOutcome: doc.gate },
        reservation: doc.reservation,
        workingCopy: doc.workingCopy,
        pendingReview: doc.pendingReview,
        approvalDecision: doc.approvalDecision,
        releaseRecord: doc.releaseRecord,
        localWork: doc.localWork,
        conflict: doc.conflict,
        lastAction: state.lastAction
      };
      return `<details class="state-card" ${state.lastAction.type === 'blocked' ? 'open' : ''}><summary>${esc(t('stateSnapshot'))} <span class="small muted">· ${esc(t('stateHint'))}</span></summary><div class="state-summary">${chip(doc.workflow, `${t('workflow')}: ${workflowLabel(doc.workflow)}`)}${chip(doc.status, `${t('status')}: ${statusLabel(doc.status)}`)}${chip(doc.gate, `${t('gate')}: ${gateLabel(doc.gate)}`)}${doc.conflict ? chip('conflict', 'STALE GENERATION', 'red') : ''}${doc.localWork && doc.localWork.preserved ? chip('local', t('localPreserved'), 'purple') : ''}</div><pre class="state-json">${esc(JSON.stringify(snapshot, null, 2))}</pre></details>`;
    }

    function renderItemTree() {
      const groups = [
        { label: ui('productDefinition'), icon: 'tree', ids: ['LD-P100-001', 'LD-P100-003', 'LD-P100-004'] },
        { label: ui('cadArtifacts'), icon: 'file', ids: ['LD-P100-002', 'LD-P100-006'] },
        { label: ui('controlledRecords'), icon: 'audit', ids: ['LD-P100-005', 'LD-P100-007', 'LD-P100-008', 'LD-P100-009', 'LD-P100-010'] }
      ];
      const root = state.docs.find(item => item.id === 'LD-P100-001');
      return `<section class="tree-view" aria-label="${esc(ui('navigator'))}"><div class="tree-root"><button type="button" class="tree-node ${state.activeDocId === root?.id ? 'selected' : ''}" data-action="select-doc" data-doc-id="${esc(root?.id || '')}" aria-current="${state.activeDocId === root?.id ? 'true' : 'false'}"><span class="tree-caret" aria-hidden="true">▾</span>${svgIcon('tree')}<span>${esc(ui('productRoot'))}</span><i class="tree-state ${statusClass(root?.workflow || '')}" aria-hidden="true"></i></button>${groups.map(group => `<div class="tree-children"><div class="tree-node" role="heading" aria-level="2"><span class="tree-caret" aria-hidden="true">▾</span>${svgIcon(group.icon)}<span>${esc(group.label)}</span></div>${group.ids.map(id => { const item = state.docs.find(doc => doc.id === id); return item ? `<button type="button" class="tree-node ${state.activeDocId === item.id ? 'selected' : ''}" data-action="select-doc" data-doc-id="${esc(item.id)}" aria-current="${state.activeDocId === item.id ? 'true' : 'false'}"><span class="tree-caret" aria-hidden="true">·</span>${svgIcon('file')}<span>${esc(item.id)}</span><i class="tree-state ${statusClass(item.workflow)}" aria-hidden="true"></i></button>` : ''; }).join('')}</div>`).join('')}</div></section>`;
    }

    function renderDocList() {
      return `<section class="doc-list-wrap"><div class="panel-header"><div><h2>${esc(t('allDocuments'))}</h2><p>10 synthetic records · active row drives the demo.</p></div><span class="badge plain">10</span></div><div class="doc-list">${state.docs.map(doc => `<button type="button" class="doc-list-item" data-action="select-doc" data-doc-id="${esc(doc.id)}" aria-current="${doc.id === state.activeDocId ? 'true' : 'false'}"><strong>${esc(titleOf(doc))}</strong><span>${esc(doc.id)} · Rev ${esc(doc.revision)} · ${esc(doc.generation || '∅')}</span><span class="list-meta"><i class="list-dot ${statusClass(doc.workflow)}"></i>${esc(workflowLabel(doc.workflow))}<span class="muted">· ${esc(statusLabel(doc.status))}</span></span></button>`).join('')}</div></section>`;
    }

    function renderContextBar(doc) {
      return `<div class="context-bar" aria-label="Breadcrumb"><button type="button" class="crumb" data-action="select-doc" data-doc-id="LD-P100-001">${svgIcon('home')}<span>${esc(ui('breadcrumbHome'))}</span></button><span class="crumb-separator" aria-hidden="true">/</span><span class="crumb">${svgIcon('tree')}<span>${esc(ui('breadcrumbProduct'))}</span></span><span class="crumb-separator" aria-hidden="true">/</span><span class="crumb current"><span class="mono">${esc(doc.id)}</span><span>${esc(ui('breadcrumbItem'))}</span></span><span class="context-spacer"></span><span class="context-meta">${esc(ui('revisionShort'))} ${esc(doc.revision)} · ${esc(ui('generationShort'))} ${esc(doc.generation || '—')}</span></div>`;
    }

    function renderExplorer(doc) {
      return `<div class="item-workspace">${renderContextBar(doc)}<div class="explorer-layout"><aside class="panel nav-panel"><div class="panel-header"><div><h2>${esc(ui('navigator'))}</h2><p>${esc(ui('layoutNote'))}</p></div><div class="nav-tools"><button type="button" class="nav-tool-btn" data-action="reset" aria-label="${esc(t('reset'))}" title="${esc(t('reset'))}">${svgIcon('refresh')}</button></div></div><div class="nav-section">Workspace</div><nav class="nav-links" aria-label="Workspace navigation"><span class="nav-link active"><span class="nav-icon">${svgIcon('home')}</span>${esc(t('myWork'))}</span><span class="nav-link"><span class="nav-icon">${svgIcon('list')}</span>${esc(t('allDocuments'))}</span><span class="nav-link"><span class="nav-icon">${svgIcon('releases')}</span>${esc(t('recentReleases'))}</span><span class="nav-link"><span class="nav-icon">${svgIcon('warning')}</span>${esc(t('blockers'))}</span></nav>${renderItemTree()}${renderDocList()}</aside><main class="panel main-panel">${renderDocHero(doc)}${renderActionBar(doc)}${renderItemTabs()}${renderItemTabContent(doc)}${renderGuidedPanel()}<div class="panel-body"><div class="metric-row">${metric('Working Head', doc.generation || '∅', doc.workflow === 'Start' ? 'Chưa publish' : 'Exact current head')}${metric('Revision', doc.revision, `Version Sequence ${doc.versionSequence || '—'}`)}${metric('Review pin', doc.pendingReview ? doc.pendingReview.generation : '—', doc.pendingReview ? 'Pending decision' : 'No pending review')}${metric('Local work', doc.workingCopy.dirty ? 'Dirty' : 'Clean', doc.localWork && doc.localWork.preserved ? 'Preserved after reject' : 'In-memory only')}</div></div>${renderStateSnapshot(doc)}</main><aside class="right-rail"><section class="panel"><div class="inspector-summary"><strong>${esc(ui('selectedItem'))}</strong><span>${esc(doc.id)} · ${esc(doc.className)}</span><div class="badge-row" style="margin-top:7px">${chip(doc.workflow, workflowLabel(doc.workflow))}${chip(doc.status, statusLabel(doc.status))}</div></div></section>${renderMetadata(doc)}${renderLinked(doc)}${renderAudit(doc.id === state.activeDocId ? 7 : 4)}</aside></div></div>`;
    }

    function renderReviewPanel() {
      if (!state.review.open) return '';
      const active = activeDoc();
       const disposition = state.review.disposition || 'KEEP';
      const summary = `IDEA Engineering — Controlled Document Workspace UI Prototype\nDirection: Object-centric Engineering Explorer\nActive: ${active.id} / Revision ${active.revision} / Generation ${active.generation || '∅'}\nActor: ${actorOf().name} (${actorOf().role})\nDisposition: ${disposition}\nVerdict: ${state.review.notes || t('noVerdict')}\nOpen questions: ${state.review.questions || '—'}`;
      const scenarioCards = [
        ['01', 'Happy path', 'Identity → action → evidence, from Start to Released.'],
        ['02', 'Conflict safety', 'Expected/current Generation are visible; no silent overwrite.'],
        ['03', 'Recovery', 'Reject returns to In Work and preserves local work.'],
        ['04', 'Actor separation', 'Author cannot self-approve or self-release.'],
        ['05', 'Revision boundary', 'Released baseline stays immutable; next Revision starts cleanly.']
      ];
      return `<div class="review-overlay" role="presentation"><section class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="review-title"><header class="review-head"><div><h2 id="review-title">${esc(t('reviewTitle'))}</h2><p>${esc(t('reviewSubtitle'))}</p></div><button type="button" class="close-btn" data-action="close-review" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="review-body"><div class="review-alert"><strong>${esc(t('recommendation'))}:</strong> Giữ một hướng Explorer duy nhất: tài liệu và identity ở trung tâm, action theo context, evidence luôn nhìn thấy. Đây là decision aid cho prototype, không phải product approval.</div><div class="review-metrics">${metric('Active document', active.id, `Revision ${active.revision}`)}${metric('UI direction', UI_DIRECTION.name, 'Single direction')}${metric('Walkthroughs', Object.keys(state.guided.completed).length, 'Completed in memory')}${metric('State events', state.audit.length, 'Audit entries')}</div><div class="review-grid"><section class="panel"><div class="panel-header"><div><h2>Design principles</h2><p>Những điều sếp đang review trong màn hình này.</p></div></div><div class="panel-body"><ul class="review-principles"><li><b>01</b><div><strong>Identity first</strong><span>Stable ID, Revision, Version, Generation và status không bị gộp.</span></div></li><li><b>02</b><div><strong>Contextual actions</strong><span>Action hợp lệ mở theo state; action bị chặn giải thích được lý do.</span></div></li><li><b>03</b><div><strong>Evidence visible</strong><span>Reservation, audit, exact pin và conflict luôn có vị trí rõ ràng.</span></div></li></ul><div class="scenario-summary">${scenarioCards.map(([number, title, detail]) => `<div><strong>${number} · ${esc(title)}</strong><span>${esc(detail)}</span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-header"><div><h2>${esc(t('decision'))}</h2><p>Ghi quyết định sau khi xem và chạy demo.</p></div></div><div class="panel-body"><div class="review-form"><label>Design disposition<select id="reviewDisposition"><option value="KEEP" ${disposition === 'KEEP' ? 'selected' : ''}>Keep this direction</option><option value="ADJUST" ${disposition === 'ADJUST' ? 'selected' : ''}>Keep, with adjustments</option><option value="STOP" ${disposition === 'STOP' ? 'selected' : ''}>Stop and revisit</option></select></label><label>${esc(t('decisionNotes'))}<textarea id="reviewNotes" placeholder="Ví dụ: ưu tiên metadata, đổi mật độ bảng...">${esc(state.review.notes)}</textarea></label><label>${esc(t('openQuestions'))}<textarea id="reviewQuestions" placeholder="Điều cần sếp quyết định tiếp...">${esc(state.review.questions)}</textarea></label></div></div></section></div><div class="review-footer"><span class="review-saved">${state.review.saved ? `<span class="status-icon">${svgIcon('check')}</span> ${esc(t('verdictSaved'))} · ${esc(state.review.savedAt)}` : esc(t('noVerdict'))}</span><div class="review-footer-actions"><button type="button" class="action-btn" data-action="copy-review">${svgIcon('copy')} <span>${esc(t('copySummary'))}</span></button><button type="button" class="action-btn" data-action="print-review">${svgIcon('print')} <span>${esc(t('printPdf'))}</span></button><button type="button" class="action-btn primary" data-action="save-review">${svgIcon('check')} <span>${esc(t('saveVerdict'))}</span></button></div></div><pre class="print-only">${esc(summary)}</pre></div></section></div>`;
    }

    function renderApp() {
      const doc = activeDoc();
      return `${renderHeader()}${renderPrototypeStrip()}<main class="page-wrap">${renderPageIntro()}${renderExplorer(doc)}</main>${renderReviewPanel()}`;
    }
    function render() {
      document.documentElement.lang = state.locale;
      document.getElementById('root').innerHTML = renderApp();
    }
    function showToast(message, isError = false) {
      const node = document.getElementById('toast');
      node.textContent = message || '';
      node.className = `toast show${isError ? ' error' : ''}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.className = 'toast'; }, 3800);
    }
    function runGuidedNext() {
      const guide = state.guided;
      const scenario = SCENARIOS[guide.scenario];
      if (!scenario || guide.step >= scenario.steps.length) return;
      const step = scenario.steps[guide.step];
      let result;
      if (step.action === 'prepare-and-publish') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); result = dispatch('publish');
      } else if (step.action === 'prepare-and-submit') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); result = dispatch('submit');
      } else if (step.action === 'prepare-and-release') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); dispatch('submit'); dispatch('switch-actor', { actorId: 'approver' }); dispatch('approve'); result = dispatch('release');
      } else result = dispatch(step.action, step.payload || {});
      const expectedBlocked = Boolean(step.expectBlocked);
      const accepted = expectedBlocked ? !result.ok : result.ok;
      if (accepted) {
        guide.step += 1;
        guide.message = expectedBlocked ? `Expected block: ${result.message}` : `Done: ${result.message}`;
        if (guide.step >= scenario.steps.length) guide.completed[guide.scenario] = true;
      } else guide.message = `Chưa đạt bước này: ${result.message}`;
      state.lastAction = { type: accepted ? 'success' : 'blocked', message: guide.message, code: result.code || '' };
      render();
      showToast(guide.message, !accepted);
    }
    function reviewPayload() {
      return { disposition: document.getElementById('reviewDisposition')?.value || state.review.disposition, notes: document.getElementById('reviewNotes')?.value || '', questions: document.getElementById('reviewQuestions')?.value || '' };
    }
    function copyReview() {
      const active = activeDoc();
      const payload = `IDEA Engineering — Controlled Document Workspace UI Prototype\nDirection: ${UI_DIRECTION.name}\nActive document: ${active.id} / Revision ${active.revision} / Generation ${active.generation || '∅'}\nActor: ${actorOf().name} · ${actorOf().role}\nDisposition: ${state.review.disposition || 'KEEP'}\nDecision: ${state.review.notes || t('noVerdict')}\nOpen questions: ${state.review.questions || '—'}`;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(() => showToast('Summary đã copy vào clipboard.')).catch(() => showToast(payload));
      else showToast(payload);
    }
    function focusReview() {
      const dialog = document.querySelector('.review-dialog');
      const firstControl = dialog?.querySelector('#reviewDisposition') || dialog?.querySelector('#reviewNotes') || dialog?.querySelector('button[data-action="close-review"]');
      firstControl?.focus();
    }
    function closeReview() {
      state.review.open = false;
      render();
      const target = reviewReturnFocus?.id ? document.getElementById(reviewReturnFocus.id) : reviewReturnFocus?.action ? document.querySelector(`[data-action="${reviewReturnFocus.action}"]`) : null;
      target?.focus();
      reviewReturnFocus = null;
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'select-doc') {
        const result = dispatch('select-doc', { id: button.dataset.docId }); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'item-tab') {
        const result = dispatch('item-tab', { tab: button.dataset.tab }); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-select') {
        const result = dispatch('guided-select', { scenario: button.dataset.scenario }); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-reset') {
        const result = dispatch('guided-reset'); render(); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-next') return runGuidedNext();
      if (action === 'open-review') {
        const active = document.activeElement;
        reviewReturnFocus = active?.id ? { id: active.id } : active?.dataset?.action ? { action: active.dataset.action } : null;
        state.review.open = true; render(); focusReview(); return;
      }
      if (action === 'close-review') { closeReview(); return; }
      if (action === 'save-review') { const result = dispatch('save-review', reviewPayload()); render(); focusReview(); showToast(result.message, !result.ok); return; }
      if (action === 'print-review') { window.print(); return; }
      if (action === 'copy-review') { copyReview(); return; }
      if (action === 'reset') { const result = dispatch('reset'); render(); showToast(result.message, !result.ok); return; }
      if (button.getAttribute('aria-disabled') === 'true') { showToast(button.title, true); return; }
      const result = dispatch(action);
      render();
      if (result.message) showToast(result.message, !result.ok);
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'localeSelect') { state.locale = event.target.value; render(); return; }
      if (event.target.id === 'actorSelect') { const result = dispatch('switch-actor', { actorId: event.target.value }); render(); showToast(result.message, !result.ok); }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'reasonInput') state.draftReason = event.target.value;
      if (event.target.id === 'reviewNotes') state.review.notes = event.target.value;
      if (event.target.id === 'reviewQuestions') state.review.questions = event.target.value;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && state.review.open) { closeReview(); return; }
      if (event.key === 'Tab' && state.review.open) {
        const dialog = document.querySelector('.review-dialog');
        const focusable = [...(dialog?.querySelectorAll('button, select, textarea, input, [tabindex]:not([tabindex="-1"])') || [])].filter(node => !node.disabled && node.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        return;
      }
      const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target?.isContentEditable) return;
    });
    render();
  </script>
</body>
</html>
