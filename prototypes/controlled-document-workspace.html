      return `<div class="conflict-recovery" aria-labelledby="conflict-recovery-title"><div class="conflict-recovery-head"><div><span class="conflict-kicker">${esc(t('staleRecoveryTitle'))}</span><strong id="conflict-recovery-title">${esc(t('staleRecoverySummary'))}</strong></div><div class="conflict-recovery-actions">${chip('WAITING', `${refreshed ? 2 : 1} / 2`, 'amber')}<button type="button" class="conflict-open-btn" data-action="stale-open">${svgIcon('route')} <span>${esc(t('staleOpenChoices'))}</span></button></div></div><div class="conflict-facts"><div><span>${esc(t('staleExpected'))}</span><b class="mono">${esc(doc.conflict.expected || '—')}</b></div><div><span>${esc(t('staleCurrent'))}</span><b class="mono">${esc(doc.conflict.current || '—')}</b></div><div><span>${esc(t('staleLocalLabel'))}</span><b>${esc(t('staleLocalSafe'))}</b></div></div><ol class="conflict-steps"><li class="conflict-step ${refreshClass}" ${!refreshed ? 'aria-current="step"' : ''}><span class="conflict-step-number">1</span><div><strong>${esc(t('staleStepRefresh'))}</strong><span>${esc(t('staleStepRefreshHint'))}</span></div><em>${esc(refreshStatus)}</em></li><li class="conflict-step ${reapplyClass}" ${refreshed ? 'aria-current="step"' : ''}><span class="conflict-step-number">2</span><div><strong>${esc(t('staleStepReapply'))}</strong><span>${esc(t('staleStepReapplyHint'))}</span></div><em>${esc(reapplyStatus)}</em></li></ol><p class="conflict-note">${svgIcon('warning')}<span>${esc(t('noBinaryMerge'))}</span></p></div>`;
    }

    function renderNextAction(doc) {
      const next = nextActionFor(doc);
      const hasConflict = Boolean(doc.conflict);
      const recoveryNeedsRefresh = hasConflict && !doc.conflict.refreshed;
      const isBlocked = state.lastAction.type === 'blocked' && state.lastAction.action === next.action;
      const waitingForRole = Boolean(next.role && !next.action);
      const nextCheck = next.action ? canAction(next.action, doc) : success('');
      const actionUnavailable = Boolean(next.action && !nextCheck.ok);
      const cardBlocked = !waitingForRole && !hasConflict && (isBlocked || actionUnavailable);
      const cardState = waitingForRole ? 'waiting' : hasConflict ? 'recovery' : cardBlocked ? 'blocked' : 'ready';
      const statusLabelText = waitingForRole ? ui('waitingForRole') : hasConflict ? (recoveryNeedsRefresh ? t('refreshRequired') : t('reapplyRequired')) : cardBlocked ? ui('blockingReason') : 'READY';
      const reason = waitingForRole ? ui('waitingForRoleHint') : hasConflict ? (actionUnavailable ? nextCheck.message : '') : isBlocked ? state.lastAction.message : actionUnavailable ? nextCheck.message : '';
      const statusChip = waitingForRole ? chip('WAITING', statusLabelText, 'amber') : hasConflict ? chip('WAITING', statusLabelText, 'amber') : cardBlocked ? chip('BLOCKED', statusLabelText, 'red') : chip('READY', statusLabelText, 'green');
      return `<section class="next-action-card ${cardState}" aria-labelledby="next-action-title"><div class="next-action-main"><span id="next-action-title">${esc(ui('nextAction'))}</span><strong>${esc(next.label)}</strong>${next.role ? `<small>${esc(next.role)}</small>` : ''}</div>${statusChip}${reason ? `<p>${esc(reason)}</p>` : ''}${hasConflict ? renderConflictRecovery(doc) : ''}</section>`;
    }

    function renderItemTabs() {
      const tabs = [
        ['overview', ui('overview'), 'file'],
        ['files', ui('files'), 'file'],
        ['structure', ui('structure'), 'tree'],
        ['lifecycle', ui('lifecycle'), 'route'],
        ['audit', ui('auditTab'), 'audit']
      ];
      return `<div class="item-tabs" role="tablist" aria-label="${esc(ui('item'))}">${tabs.map(([id, label, icon]) => { const selected = state.detailDrawer.open ? state.detailDrawer.tab === id : id === 'overview'; const controls = id === 'overview' ? 'item-tab-panel' : 'detail-drawer'; return `<button type="button" id="item-tab-${id}" class="item-tab" role="tab" aria-selected="${selected ? 'true' : 'false'}" aria-controls="${controls}" data-action="item-tab" data-tab="${id}">${svgIcon(icon)} <span>${esc(label)}</span></button>`; }).join('')}</div>`;
    }

    function propertyRows(doc, compact = false) {
      if (compact) return [
        [t('documentClass'), doc.className, false], [ui('category'), doc.category, false], [ui('ownerShort'), doc.owner, false], [ui('structureShort'), doc.structure, false]
      ];
      return [
        [t('document'), titleOf(doc), false], [t('documentClass'), doc.className, false], [ui('category'), doc.category, false], [ui('ownerShort'), doc.owner, false], [ui('structureShort'), doc.structure, false], [t('gate'), gateLabel(doc.gate), false], [t('reservation'), reservationLabel(doc), false], [ui('workingHead'), doc.workingHead || '—', true], [ui('digestShort'), doc.digest, true]
      ];
    }
    function propertyGrid(rows) {
      return `<dl class="property-grid">${rows.map(([label, value, mono]) => `<div class="property-field"><dt>${esc(label)}</dt><dd class="${mono ? 'mono' : ''}">${esc(value)}</dd></div>`).join('')}</dl>`;
    }
    function renderPropertyForm(doc, compact = false, includeHeader = true) {
      const heading = compact ? ui('keyProperties') : ui('allProperties');
      const header = includeHeader ? `<div class="form-section-header"><h3>${esc(heading)}</h3><span>${esc(ui('controlledForm'))}</span></div>` : '';
      return `<section class="form-section ${compact ? 'compact-properties' : ''}">${header}${propertyGrid(propertyRows(doc, compact))}</section>`;
    }

    function renderLifecycle(doc) {
      const states = [
        ['Start', ui('startState')],
        ['In Work', ui('inWorkState')],
        ['Under Review', ui('reviewState')],
        ['Released', ui('releasedState')]
      ];
      const currentIndex = Math.max(0, states.findIndex(([value]) => value === doc.workflow));
      return `<section class="form-section"><div class="form-section-header"><h3>${esc(ui('lifecycleMap'))}</h3><span>${esc(ui('currentState'))}</span></div><div class="lifecycle-strip" aria-label="${esc(ui('lifecycle'))}">${states.map(([value, label], index) => `<div class="lifecycle-step ${index < currentIndex ? 'done' : ''} ${index === currentIndex ? 'current' : ''}"><strong>${esc(label)}</strong><span>${index < currentIndex ? 'Complete' : index === currentIndex ? 'Current state' : 'Next state'}</span></div>`).join('')}</div></section>`;
    }

    function renderLifecycleSummary(doc) {
      const states = ['Start', 'In Work', 'Under Review', 'Released'];
      const currentIndex = Math.max(0, states.indexOf(doc.workflow));
      const next = states[currentIndex + 1];
      return `<section class="form-section overview-card"><div class="form-section-header"><h3>${esc(ui('lifecycle'))}</h3><span>${esc(ui('currentState'))}</span></div><div class="lifecycle-summary"><div><strong>${esc(workflowLabel(doc.workflow))}</strong><span>${esc(statusLabel(doc.status))}</span></div><span class="summary-arrow" aria-hidden="true">→</span><div><strong>${esc(next ? workflowLabel(next) : ui('releasedState'))}</strong><span>${esc(next ? ui('nextState') : ui('currentState'))}</span></div></div></section>`;
    }

    function relationLabel(item) {
      if (item.category === 'CAD') return 'CAD representation';
      if (item.category === 'Quality') return 'Verification / control';
      if (item.category === 'Release') return 'Release package';
      if (item.category === 'Office') return 'Controlled reference';
      return 'Related document';
    }

    // Tree icons communicate the broad document category, while the class name
    // remains the accessible textual label. This keeps all Office records
    // visually consistent without losing their more specific class names.
    const DOCUMENT_CATEGORY_ICONS = {
      'Product Definition': 'definition',
      CAD: 'cad',
      Office: 'spec',
      Quality: 'checklist',
      Release: 'package'
    };
    function documentIcon(item) {
      return DOCUMENT_CATEGORY_ICONS[item && item.category] || 'file';
    }

    function renderRelationshipGrid(doc) {
      const linkedDocs = doc.linked.map(id => state.docs.find(item => item.id === id)).filter(Boolean);
      return `<section class="form-section relationship-section"><div class="form-section-header"><h3>${esc(ui('relationships'))}</h3><span>${linkedDocs.length} linked item${linkedDocs.length === 1 ? '' : 's'}</span></div>${linkedDocs.length ? `<div class="relationship-table-wrap"><table class="data-table relationship-table"><thead><tr><th>${esc(ui('relation'))}</th><th>${esc(ui('itemId'))}</th><th>${esc(ui('revisionShort'))}</th><th>${esc(ui('generationShort'))}</th><th>${esc(ui('stateShort'))}</th><th>${esc(ui('ownerShort'))}</th></tr></thead><tbody>${linkedDocs.map(item => `<tr><td>${esc(relationLabel(item))}</td><td><button type="button" class="item-link" data-action="select-doc" data-doc-id="${esc(item.id)}">${svgIcon('external')}<span>${esc(item.id)}</span></button><div class="small muted">${esc(titleOf(item))}</div></td><td class="mono">${esc(item.revision)}</td><td class="mono">${esc(item.generation || '—')}</td><td>${chip(item.workflow, workflowLabel(item.workflow))}</td><td>${esc(item.owner)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="tab-empty">${esc(ui('noRelations'))}</div>`}</section>`;
    }

    function renderOverview(doc) {
      const linkedCount = doc.linked.map(id => state.docs.find(item => item.id === id)).filter(Boolean).length;
      return `<div class="overview-grid">${renderPropertyForm(doc, true)}${renderLifecycleSummary(doc)}<section class="form-section overview-card relationship-summary"><div class="form-section-header"><h3>${esc(ui('relationships'))}</h3><span>${linkedCount}</span></div><div class="overview-summary-row"><div><strong>${linkedCount} linked item${linkedCount === 1 ? '' : 's'}</strong><span>${esc(ui('relationshipHint'))}</span></div><button type="button" id="overview-structure" class="inline-link" data-action="item-tab" data-tab="structure">${svgIcon('tree')} ${esc(ui('openDetails'))}</button></div></section></div>`;
    }

    function renderFileRepresentations(doc) {
      const rows = [
        [ui('nativeFile'), `${doc.id}.source`, doc.workingCopy.open ? 'Workspace' : 'Vault', doc.generation || '—', doc.digest],
        [ui('previewFile'), `${doc.id}.preview.pdf`, 'Derived', doc.generation || '—', 'sha256:preview…'],
        [ui('evidenceFile'), `${doc.id}.release.json`, doc.releaseRecord ? 'Release Record' : 'Pending release', doc.releaseRecord ? doc.releaseRecord.generation : '—', doc.releaseRecord ? 'sha256:release…' : '—']
      ];
      return `<section class="form-section"><div class="form-section-header"><h3>${esc(ui('files'))}</h3><span>${esc(ui('current'))}: ${esc(doc.generation || '—')}</span></div><div class="relationship-table-wrap"><table class="data-table file-table"><thead><tr><th>${esc(ui('fileRole'))}</th><th>${esc(ui('fileName'))}</th><th>${esc(ui('source'))}</th><th>${esc(ui('generationShort'))}</th><th>${esc(ui('digestShort'))}</th></tr></thead><tbody>${rows.map(row => `<tr><td class="role-cell">${esc(row[0])}</td><td>${esc(row[1])}</td><td>${esc(row[2])}</td><td class="mono">${esc(row[3])}</td><td class="mono">${esc(row[4])}</td></tr>`).join('')}</tbody></table></div></section>`;
    }

    function renderDetailContent(doc, tab) {
      let content;
      switch (tab) {
        case 'properties': content = renderPropertyForm(doc, false); break;
        case 'files': content = renderFileRepresentations(doc); break;
        case 'structure': content = renderRelationshipGrid(doc); break;
        case 'lifecycle': content = renderLifecycle(doc); break;
        case 'audit': content = renderAudit(doc, 30); break;
        default: content = renderOverview(doc);
      }
      return content;
    }

    function renderGuidedModal() {
      const guide = state.guided;
      const scenario = SCENARIOS[guide.scenario];
      if (!guide.open || !scenario) return '';
      const total = scenario.steps.length;
      const complete = guide.step >= total;
      const step = scenario.steps[Math.min(guide.step, total - 1)];
      const progress = Math.round(Math.min(guide.step, total) / total * 100);
      const tabs = Object.entries(SCENARIOS).map(([id, item]) => `<button type="button" class="guided-tab" role="tab" aria-selected="${guide.scenario === id ? 'true' : 'false'}" data-action="guided-select" data-scenario="${id}">${esc(t(item.titleKey))}${guide.completed[id] ? `<span class="completion-mark" aria-label="${esc(t('complete'))}">${svgIcon('check')}</span>` : ''}</button>`).join('');
      return `<div class="overlay-layer modal-layer guided-layer"><div class="overlay-scrim" data-action="guided-close" aria-hidden="true"></div><section class="guided-dialog" role="dialog" aria-modal="true" aria-labelledby="guided-title"><header class="modal-head"><div><div class="eyebrow">${esc(ui('openGuided'))}</div><h2 id="guided-title">${esc(t('guided'))}</h2><p>${esc(t(scenario.titleKey))} · ${complete ? esc(t('complete')) : `${esc(t('step'))} ${guide.step + 1}/${total}`}</p></div><button type="button" class="close-btn" data-action="guided-close" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="modal-body guided-dialog-body"><p class="modal-hint">${esc(t('guidedHint'))}</p><div class="guided-tabs" role="tablist" aria-label="${esc(t('guided'))}">${tabs}</div><div class="guided-progress" aria-hidden="true"><span style="width:${progress}%"></span></div><div class="guided-body"><div class="guided-step">${complete ? `<strong>${esc(t('complete'))}: ${esc(t(scenario.titleKey))}</strong><span>${esc(scenario.description)}</span>` : `<strong>${esc(step.title)}</strong><span>${esc(step.detail)}</span>`}</div><div class="guided-controls">${complete ? '' : `<button type="button" class="guide-btn primary" data-action="guided-next">${svgIcon('arrow')} <span>${esc(t('runNext'))}</span></button>`}<button type="button" class="guide-btn" data-action="guided-reset">${svgIcon('reset')} <span>${esc(t('restart'))}</span></button></div>${guide.message ? `<div class="guided-message">${esc(guide.message)}</div>` : ''}</div></div></section></div>`;
    }

    function renderEvidenceSummary(doc) {
      const exactPin = doc.pendingReview ? doc.pendingReview.generation : (doc.releaseRecord ? doc.releaseRecord.generation : doc.generation);
      const rows = [
        [ui('controlReservation'), reservationLabel(doc), false], [ui('controlPin'), exactPin || '—', true], [ui('controlGate'), gateLabel(doc.gate), false]
      ];
      const conflictStatus = doc.conflict
        ? chip('conflict', doc.conflict.refreshed ? t('reapplyRequired') : 'STALE', doc.conflict.refreshed ? 'amber' : 'red')
        : '';
      return `<section class="panel evidence-panel"><div class="panel-header"><div><h2>${esc(ui('controlSummary'))}</h2><p>${esc(ui('controlSummaryHint'))}</p></div>${conflictStatus}</div><div class="panel-body"><dl class="evidence-list">${rows.map(([label, value, mono]) => `<div><dt>${esc(label)}</dt><dd class="${mono ? 'mono' : ''}">${esc(value)}</dd></div>`).join('')}</dl>${doc.baselineFrom ? `<p class="small muted">Baseline from: <span class="mono">${esc(doc.baselineFrom)}</span></p>` : ''}</div></section>`;
    }

    function renderRailLinks(doc) {
      const linkedCount = doc.linked.map(id => state.docs.find(item => item.id === id)).filter(Boolean).length;
      const links = [
        ['files', ui('files'), 3, 'file'], ['structure', ui('structure'), linkedCount, 'tree']
      ];
      return `<section class="panel"><div class="panel-header"><div><h2>${esc(ui('details'))}</h2><p>${esc(ui('detailsHint'))}</p></div></div><div class="panel-body"><div class="rail-links">${links.map(([tab, label, count, icon]) => `<button type="button" id="rail-detail-${tab}" class="rail-link" data-action="item-tab" data-tab="${tab}"><span>${svgIcon(icon)} ${esc(label)}</span><strong>${count}</strong></button>`).join('')}</div></div></section>`;
    }

    function renderRecentAudit(doc) {
      const itemEvents = state.audit.filter(event => event.docId === doc.id);
      const events = itemEvents.slice(0, 3);
      const rows = events.length ? events.map(event => `<div class="recent-audit-item"><div class="recent-audit-time">${esc(event.time.split(' ')[1] || event.time)}</div><div class="recent-audit-content"><strong>${esc(event.type)}</strong><span>${esc(event.actor)} · <span class="mono">${esc(event.docId || 'workspace')}</span></span><em>${esc(event.detail)}</em></div></div>`).join('') : `<div class="empty-state">${esc(ui('auditEmpty'))}</div>`;
      return `<section class="panel recent-audit-panel"><div class="panel-header"><div><h2>${esc(ui('recentAudit'))}</h2><p>${esc(ui('recentAuditHint'))}</p></div><span class="badge plain">${itemEvents.length}</span></div><div class="panel-body"><div class="recent-audit-list">${rows}</div><button type="button" id="rail-detail-audit" class="inline-link audit-open-link" data-action="item-tab" data-tab="audit">${svgIcon('audit')} ${esc(ui('openDetails'))}</button></div></section>`;
    }

    function renderAudit(doc, limit = 8) {
      const itemEvents = state.audit.filter(event => event.docId === doc.id);
      const events = itemEvents.slice(0, limit);
      const content = events.length ? events.map(event => `<div class="timeline-item"><div class="timeline-time">${esc(event.time.split(' ')[1] || event.time)}</div><div class="timeline-dot" aria-hidden="true"></div><div class="timeline-content"><strong>${esc(event.type)}</strong><span>${esc(event.actor)} · <span class="mono">${esc(event.docId || 'workspace')}</span></span><em>${esc(event.detail)}</em></div></div>`).join('') : `<div class="tab-empty">${esc(ui('auditEmpty'))}</div>`;
      return `<section class="form-section audit-detail-section"><div class="form-section-header"><div><h3>${esc(t('audit'))}</h3><span>Attributable demo events; không chỉnh sửa được.</span></div><span class="badge plain">${itemEvents.length}</span></div><div class="panel-body"><div class="timeline">${content}</div></div></section>`;
    }

    function renderStateSnapshot(doc, expanded = false) {
      const snapshot = {
        actor: { id: state.actorId, name: actorOf().name, role: actorOf().role, workspace: actorOf().workspace },
        activeDocument: { id: doc.id, revision: doc.revision, documentVersion: doc.documentVersion, versionSequence: doc.versionSequence, generation: doc.generation, workingHead: doc.workingHead, workflow: doc.workflow, documentStatus: doc.status, gateOutcome: doc.gate },
        reservation: doc.reservation,
        workingCopy: doc.workingCopy,
        pendingReview: doc.pendingReview,
        approvalDecision: doc.approvalDecision,
        releaseRecord: doc.releaseRecord,
        localWork: doc.localWork,
        conflict: doc.conflict,
        lastAction: state.lastAction
      };
      const conflictStatus = doc.conflict
        ? chip('conflict', doc.conflict.refreshed ? t('reapplyRequired') : 'STALE GENERATION', doc.conflict.refreshed ? 'amber' : 'red')
        : '';
      const summary = `<div class="state-summary">${chip(doc.workflow, `${t('workflow')}: ${workflowLabel(doc.workflow)}`)}${chip(doc.status, `${t('status')}: ${statusLabel(doc.status)}`)}${chip(doc.gate, `${t('gate')}: ${gateLabel(doc.gate)}`)}${conflictStatus}${doc.localWork && doc.localWork.preserved ? chip('local', t('localPreserved'), 'purple') : ''}</div>`;
      const body = `${summary}<pre class="state-json">${esc(JSON.stringify(snapshot, null, 2))}</pre>`;
      return expanded ? `<section class="diagnostics-snapshot">${body}</section>` : `<details class="state-card"><summary>${esc(ui('stateInspector'))} <span class="small muted">· ${esc(ui('stateInspectorHint'))}</span></summary>${body}</details>`;
    }

    function renderDetailDrawer(doc) {
      if (!state.detailDrawer.open) return '';
      const tab = state.detailDrawer.tab;
      const title = ({ properties: ui('allProperties'), files: ui('files'), structure: ui('structure'), lifecycle: ui('lifecycle'), audit: ui('auditTab') })[tab] || ui('details');
      const count = tab === 'files' ? 3 : tab === 'structure' ? doc.linked.length : tab === 'audit' ? state.audit.filter(event => event.docId === doc.id).length : '';
      return `<div class="overlay-layer drawer-layer"><div class="overlay-scrim" data-action="detail-close" aria-hidden="true"></div><aside id="detail-drawer" class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detail-drawer-title"><header class="drawer-head"><div><div class="eyebrow">${esc(ui('details'))}</div><h2 id="detail-drawer-title">${esc(title)}${count !== '' ? ` <span class="drawer-count">${count}</span>` : ''}</h2><p><span class="mono">${esc(doc.id)}</span> · ${esc(ui('detailHint'))}</p></div><button type="button" class="close-btn" data-action="detail-close" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="drawer-body">${renderDetailContent(doc, tab)}</div></aside></div>`;
    }

    function renderDiagnosticsModal(doc) {
      if (!state.diagnosticsOpen) return '';
      return `<div class="overlay-layer modal-layer diagnostics-layer"><div class="overlay-scrim" data-action="diagnostics-close" aria-hidden="true"></div><section class="diagnostics-dialog" role="dialog" aria-modal="true" aria-labelledby="diagnostics-title"><header class="modal-head"><div><div class="eyebrow">${esc(ui('details'))}</div><h2 id="diagnostics-title">${esc(ui('stateInspector'))}</h2><p>${esc(ui('stateInspectorHint'))}</p></div><button type="button" class="close-btn" data-action="diagnostics-close" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="modal-body">${renderStateSnapshot(doc, true)}</div></section></div>`;
    }

    function renderStaleDialog(doc) {
      if (!state.staleDialogOpen || !doc.conflict) return '';
      const conflict = doc.conflict;
      const localSummary = doc.workingCopy.hasLocalChanges ? t('staleLocalChanges') : t('none');
      return `<div class="overlay-layer modal-layer stale-layer"><div class="overlay-scrim" data-action="stale-cancel" aria-hidden="true"></div><section class="stale-dialog" role="dialog" aria-modal="true" aria-labelledby="stale-dialog-title" aria-describedby="stale-dialog-summary"><header class="modal-head"><div><div class="eyebrow">${esc(t('scenarioStale'))}</div><h2 id="stale-dialog-title">${esc(t('staleDialogTitle'))}</h2><p id="stale-dialog-summary"><span class="mono">${esc(doc.id)}</span> · ${esc(t('staleDialogSummary'))}</p></div><button type="button" class="close-btn" data-action="stale-cancel" aria-label="${esc(t('staleCancel'))}">${svgIcon('close')}</button></header><div class="modal-body stale-dialog-body"><p class="stale-dialog-choice-hint">${esc(t('staleDialogChoiceHint'))}</p><div class="stale-version-grid"><div class="stale-version-card"><span>${esc(t('staleDialogBase'))}</span><strong class="mono">${esc(conflict.expected || '—')}</strong><small>${esc(t('staleDialogBaseHint'))}</small></div><div class="stale-version-card"><span>${esc(t('staleDialogCurrent'))}</span><strong class="mono">${esc(conflict.current || '—')}</strong><small>${esc(t('staleDialogCurrentHint'))}</small></div><div class="stale-version-card"><span>${esc(t('staleDialogChanges'))}</span><strong>${esc(localSummary)}</strong><small>${esc(t('staleDialogLocalHint'))}</small></div></div><p class="stale-warning">${svgIcon('warning')}<span>${esc(t('staleWarning'))}</span></p><div class="stale-choice-list"><button type="button" class="stale-choice primary" data-action="stale-keep-local"><span class="stale-choice-icon">${svgIcon('copy')}</span><span class="stale-choice-copy"><span class="stale-choice-title">${esc(t('staleKeepLocal'))}</span><span class="stale-choice-hint">${esc(t('staleKeepLocalHint'))}</span></span><span class="stale-choice-arrow" aria-hidden="true">→</span></button><button type="button" class="stale-choice" data-action="stale-get-latest"><span class="stale-choice-icon">${svgIcon('refresh')}</span><span class="stale-choice-copy"><span class="stale-choice-title">${esc(t('staleGetLatest'))}</span><span class="stale-choice-hint">${esc(t('staleGetLatestHint'))}</span></span><span class="stale-choice-arrow" aria-hidden="true">→</span></button><button type="button" class="stale-choice" data-action="stale-cancel"><span class="stale-choice-icon">${svgIcon('close')}</span><span class="stale-choice-copy"><span class="stale-choice-title">${esc(t('staleCancel'))}</span><span class="stale-choice-hint">${esc(t('staleCancelHint'))}</span></span><span class="stale-choice-arrow" aria-hidden="true">×</span></button></div></div></section></div>`;
    }

    function renderNavDrawer() {
      if (!state.navDrawerOpen) return '';
      return `<div class="overlay-layer drawer-layer context-drawer-layer"><div class="overlay-scrim" data-action="nav-close" aria-hidden="true"></div><aside id="nav-drawer" class="detail-drawer context-drawer" role="dialog" aria-modal="true" aria-labelledby="nav-drawer-title"><header class="drawer-head"><div><div class="eyebrow">${esc(ui('navigator'))}</div><h2 id="nav-drawer-title">${esc(ui('productRoot'))}</h2><p>${esc(ui('detailHint'))}</p></div><button type="button" class="close-btn" data-action="nav-close" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="drawer-body">${renderNavigator()}</div></aside></div>`;
    }

    function renderEvidenceDrawer(doc) {
      if (!state.evidenceDrawerOpen) return '';
      return `<div class="overlay-layer drawer-layer context-drawer-layer"><div class="overlay-scrim" data-action="evidence-close" aria-hidden="true"></div><aside id="evidence-drawer" class="detail-drawer context-drawer evidence-drawer" role="dialog" aria-modal="true" aria-labelledby="evidence-drawer-title"><header class="drawer-head"><div><div class="eyebrow">${esc(ui('controlSummary'))}</div><h2 id="evidence-drawer-title">${esc(ui('controlSummary'))}</h2><p><span class="mono">${esc(doc.id)}</span> · ${esc(ui('controlSummaryHint'))}</p></div><button type="button" class="close-btn" data-action="evidence-close" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="drawer-body evidence-drawer-body">${renderEvidenceSummary(doc)}${renderRailLinks(doc)}${renderRecentAudit(doc)}</div></aside></div>`;
    }

    function renderItemTree() {
      const groups = [
        { key: 'productDefinition', label: ui('productDefinition'), icon: 'tree', ids: ['LD-P100-001', 'LD-P100-003', 'LD-P100-004'] },
        { key: 'cadArtifacts', label: ui('cadArtifacts'), icon: 'file', ids: ['LD-P100-002', 'LD-P100-006'] },
        { key: 'controlledRecords', label: ui('controlledRecords'), icon: 'audit', ids: ['LD-P100-005', 'LD-P100-007', 'LD-P100-008', 'LD-P100-009', 'LD-P100-010'] }
      ];
      const root = state.docs.find(item => item.id === 'LD-P100-001');
      const collapsed = state.treeCollapsed || {};
      const toggleLabel = (expanded, label) => `${expanded ? ui('collapse') : ui('expand')} ${label}`;
      const rootExpanded = !collapsed.root;
      const rootMarkup = `<button type="button" class="tree-node tree-toggle" data-action="toggle-tree" data-tree-key="root" aria-expanded="${rootExpanded ? 'true' : 'false'}" aria-label="${esc(toggleLabel(rootExpanded, ui('productRoot')))}"><span class="tree-caret" aria-hidden="true">${rootExpanded ? '▾' : '▸'}</span>${svgIcon('tree')}<span>${esc(ui('productRoot'))}</span><i class="tree-state ${statusClass(root?.workflow || '')}" aria-hidden="true"></i></button>`;
      const groupsMarkup = rootExpanded ? groups.map(group => {
        const expanded = !collapsed[group.key];
        const docsMarkup = expanded ? group.ids.map(id => {
          const item = state.docs.find(doc => doc.id === id);
          return item ? `<button type="button" class="tree-node ${item.id === state.activeDocId ? 'selected' : ''}" data-action="select-doc" data-doc-id="${esc(item.id)}" aria-current="${item.id === state.activeDocId ? 'true' : 'false'}" aria-label="${esc(`${item.id} · ${item.className}`)}" title="${esc(item.className)}"><span class="tree-caret" aria-hidden="true">·</span>${svgIcon(documentIcon(item))}<span>${esc(item.id)}</span><i class="tree-state ${statusClass(item.workflow)}" aria-hidden="true"></i></button>` : '';
        }).join('') : '';
        return `<div class="tree-children"><button type="button" class="tree-node tree-toggle" data-action="toggle-tree" data-tree-key="${esc(group.key)}" aria-expanded="${expanded ? 'true' : 'false'}" aria-label="${esc(toggleLabel(expanded, group.label))}"><span class="tree-caret" aria-hidden="true">${expanded ? '▾' : '▸'}</span>${svgIcon(group.icon)}<span>${esc(group.label)}</span></button>${docsMarkup}</div>`;
      }).join('') : '';
      return `<section class="tree-view" aria-label="${esc(ui('navigator'))}"><div class="tree-root">${rootMarkup}${groupsMarkup}</div></section>`;
    }

    function renderDocList() {
      return `<details class="doc-list-disclosure"><summary><span>${esc(t('allDocuments'))}</span><strong>10</strong></summary><div class="doc-list">${state.docs.map(doc => `<button type="button" class="doc-list-item" data-action="select-doc" data-doc-id="${esc(doc.id)}" aria-current="${doc.id === state.activeDocId ? 'true' : 'false'}"><strong>${esc(titleOf(doc))}</strong><span>${esc(doc.id)} · ${esc(workflowLabel(doc.workflow))}</span></button>`).join('')}</div></details>`;
    }

    function renderContextBar(doc) {
      return `<div class="context-bar" aria-label="Breadcrumb"><button type="button" class="crumb" data-action="select-doc" data-doc-id="LD-P100-001">${svgIcon('home')}<span>${esc(ui('breadcrumbHome'))}</span></button><span class="crumb-separator" aria-hidden="true">/</span><span class="crumb">${svgIcon('tree')}<span>${esc(ui('breadcrumbProduct'))}</span></span><span class="crumb-separator" aria-hidden="true">/</span><span class="crumb current" aria-current="page"><span class="mono">${esc(doc.id)}</span></span></div>`;
    }

    function renderNavigator() {
      return `<div class="panel-header"><div><h2>${esc(ui('navigator'))}</h2><p>${esc(ui('productRoot'))}</p></div></div><div class="nav-section">Workspace</div><nav class="nav-links" aria-label="Workspace navigation"><span class="nav-link active"><span class="nav-icon">${svgIcon('home')}</span>${esc(t('myWork'))}</span></nav>${renderItemTree()}${renderDocList()}`;
    }

    function renderMobileWorkspaceTools() {
      return `<div class="mobile-workspace-tools"><button type="button" id="mobile-nav-open" class="mobile-tool" data-action="nav-open">${svgIcon('list')}<span>${esc(ui('navigator'))}</span></button><button type="button" id="mobile-evidence-open" class="mobile-tool" data-action="evidence-open">${svgIcon('audit')}<span>${esc(ui('controlSummary'))}</span></button></div>`;
    }

    function renderExplorer(doc) {
      return `<div class="item-workspace">${renderContextBar(doc)}${renderMobileWorkspaceTools()}<div class="explorer-layout"><aside class="panel nav-panel">${renderNavigator()}</aside><main class="panel main-panel">${renderDocHero(doc)}${renderActionBar(doc)}${renderNextAction(doc)}${renderItemTabs()}<div id="item-tab-panel" class="tab-panel" role="tabpanel">${renderOverview(doc)}</div></main><aside class="right-rail">${renderEvidenceSummary(doc)}${renderRailLinks(doc)}${renderRecentAudit(doc)}</aside></div></div>`;
    }

    function renderReviewPanel() {
      if (!state.review.open) return '';
      const active = activeDoc();
       const disposition = state.review.disposition || 'KEEP';
      const summary = `IDEA Engineering — Controlled Document Workspace UI Prototype\nDirection: Object-centric Engineering Explorer\nActive: ${active.id} / Revision ${active.revision} / Generation ${active.generation || '∅'}\nActor: ${actorOf().name} (${actorOf().role})\nDisposition: ${disposition}\nVerdict: ${state.review.notes || t('noVerdict')}\nOpen questions: ${state.review.questions || '—'}`;
      const scenarioCards = [
        ['01', 'Happy path', 'Identity → action → evidence, from Start to Released.'],
        ['02', 'Conflict safety', 'Expected/current Generation are visible; no silent overwrite.'],
        ['03', 'Recovery', 'Reject returns to In Work and preserves local work.'],
        ['04', 'Actor separation', 'Author cannot self-approve or self-release.'],
        ['05', 'Revision boundary', 'Released baseline stays immutable; next Revision starts cleanly.']
      ];
      return `<div class="review-overlay" role="presentation"><section class="review-dialog" role="dialog" aria-modal="true" aria-labelledby="review-title"><header class="review-head"><div><h2 id="review-title">${esc(t('reviewTitle'))}</h2><p>${esc(t('reviewSubtitle'))}</p></div><button type="button" class="close-btn" data-action="close-review" aria-label="${esc(t('close'))}">${svgIcon('close')}</button></header><div class="review-body"><div class="review-alert"><strong>${esc(t('recommendation'))}:</strong> Giữ một hướng Explorer duy nhất: tài liệu và identity ở trung tâm, action theo context, evidence luôn nhìn thấy. Đây là decision aid cho prototype, không phải product approval.</div><div class="review-metrics">${metric('Active document', active.id, `Revision ${active.revision}`)}${metric('UI direction', UI_DIRECTION.name, 'Single direction')}${metric('Walkthroughs', Object.keys(state.guided.completed).length, 'Completed in memory')}${metric('State events', state.audit.length, 'Audit entries')}</div><div class="review-grid"><section class="panel"><div class="panel-header"><div><h2>Design principles</h2><p>Những điều sếp đang review trong màn hình này.</p></div></div><div class="panel-body"><ul class="review-principles"><li><b>01</b><div><strong>Identity first</strong><span>Stable ID, Revision, Version, Generation và status không bị gộp.</span></div></li><li><b>02</b><div><strong>Contextual actions</strong><span>Action hợp lệ mở theo state; action bị chặn giải thích được lý do.</span></div></li><li><b>03</b><div><strong>Evidence visible</strong><span>Reservation, audit, exact pin và conflict luôn có vị trí rõ ràng.</span></div></li></ul><div class="scenario-summary">${scenarioCards.map(([number, title, detail]) => `<div><strong>${number} · ${esc(title)}</strong><span>${esc(detail)}</span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-header"><div><h2>${esc(t('decision'))}</h2><p>Ghi quyết định sau khi xem và chạy demo.</p></div></div><div class="panel-body"><div class="review-form"><label>Design disposition<select id="reviewDisposition"><option value="KEEP" ${disposition === 'KEEP' ? 'selected' : ''}>Keep this direction</option><option value="ADJUST" ${disposition === 'ADJUST' ? 'selected' : ''}>Keep, with adjustments</option><option value="STOP" ${disposition === 'STOP' ? 'selected' : ''}>Stop and revisit</option></select></label><label>${esc(t('decisionNotes'))}<textarea id="reviewNotes" placeholder="Ví dụ: ưu tiên metadata, đổi mật độ bảng...">${esc(state.review.notes)}</textarea></label><label>${esc(t('openQuestions'))}<textarea id="reviewQuestions" placeholder="Điều cần sếp quyết định tiếp...">${esc(state.review.questions)}</textarea></label></div></div></section></div><div class="review-footer"><span class="review-saved">${state.review.saved ? `<span class="status-icon">${svgIcon('check')}</span> ${esc(t('verdictSaved'))} · ${esc(state.review.savedAt)}` : esc(t('noVerdict'))}</span><div class="review-footer-actions"><button type="button" class="action-btn" data-action="copy-review">${svgIcon('copy')} <span>${esc(t('copySummary'))}</span></button><button type="button" class="action-btn" data-action="print-review">${svgIcon('print')} <span>${esc(t('printPdf'))}</span></button><button type="button" class="action-btn primary" data-action="save-review">${svgIcon('check')} <span>${esc(t('saveVerdict'))}</span></button></div></div><pre class="print-only">${esc(summary)}</pre></div></section></div>`;
    }

    function renderApp() {
      const doc = activeDoc();
      return `${renderHeader()}<main class="page-wrap">${renderExplorer(doc)}</main>${renderDetailDrawer(doc)}${renderNavDrawer()}${renderEvidenceDrawer(doc)}${renderGuidedModal()}${renderDiagnosticsModal(doc)}${renderStaleDialog(doc)}${renderReviewPanel()}`;
    }
    function render() {
      document.documentElement.lang = state.locale;
      document.getElementById('root').innerHTML = renderApp();
      syncOverlayState();
    }
    function showToast(message, isError = false) {
      const node = document.getElementById('toast');
      node.textContent = message || '';
      node.className = `toast show${isError ? ' error' : ''}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.className = 'toast'; }, 3800);
    }
    function runGuidedNext() {
      const guide = state.guided;
      guide.open = true;
      const scenario = SCENARIOS[guide.scenario];
      if (!scenario || guide.step >= scenario.steps.length) return;
      const step = scenario.steps[guide.step];
      let result;
      if (step.action === 'prepare-and-publish') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); result = dispatch('publish');
      } else if (step.action === 'prepare-and-submit') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); result = dispatch('submit');
      } else if (step.action === 'prepare-and-release') {
        dispatch('switch-actor', { actorId: 'author' }); dispatch('reserve'); dispatch('open'); dispatch('edit'); dispatch('publish'); dispatch('submit'); dispatch('switch-actor', { actorId: 'approver' }); dispatch('approve'); result = dispatch('release');
      } else result = dispatch(step.action, step.payload || {});
      const expectedBlocked = Boolean(step.expectBlocked);
      const accepted = expectedBlocked ? !result.ok : result.ok;
      if (accepted) {
        guide.step += 1;
        guide.message = expectedBlocked ? `Expected block: ${result.message}` : `Done: ${result.message}`;
        if (guide.step >= scenario.steps.length) guide.completed[guide.scenario] = true;
      } else guide.message = `Chưa đạt bước này: ${result.message}`;
      state.lastAction = { type: accepted ? 'success' : 'blocked', action: step.action, message: guide.message, code: result.code || '' };
      render();
      focusDialog(state.staleDialogOpen ? '.stale-dialog' : '.guided-dialog');
      showToast(guide.message, !accepted);
    }
    function reviewPayload() {
      return { disposition: document.getElementById('reviewDisposition')?.value || state.review.disposition, notes: document.getElementById('reviewNotes')?.value || '', questions: document.getElementById('reviewQuestions')?.value || '' };
    }
    function copyReview() {
      const active = activeDoc();
      const payload = `IDEA Engineering — Controlled Document Workspace UI Prototype\nDirection: ${UI_DIRECTION.name}\nActive document: ${active.id} / Revision ${active.revision} / Generation ${active.generation || '∅'}\nActor: ${actorOf().name} · ${actorOf().role}\nDisposition: ${state.review.disposition || 'KEEP'}\nDecision: ${state.review.notes || t('noVerdict')}\nOpen questions: ${state.review.questions || '—'}`;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(payload).then(() => showToast('Summary đã copy vào clipboard.')).catch(() => showToast(payload));
      else showToast(payload);
    }
    function focusReview() {
      const dialog = document.querySelector('.review-dialog');
      const firstControl = dialog?.querySelector('#reviewDisposition') || dialog?.querySelector('#reviewNotes') || dialog?.querySelector('button[data-action="close-review"]');
      firstControl?.focus();
    }

    function describeFocus(node) {
      if (!node) return null;
      return { id: node.id || '', action: node.dataset?.action || '', tab: node.dataset?.tab || '', docId: node.dataset?.docId || '' };
    }
    function findFocusTarget(info) {
      if (!info) return null;
      if (info.id) return document.getElementById(info.id);
      return [...document.querySelectorAll('[data-action]')].find(node =>
        (!info.action || node.dataset.action === info.action) &&
        (!info.tab || node.dataset.tab === info.tab) &&
        (!info.docId || node.dataset.docId === info.docId)
      ) || null;
    }
    function restoreFocus(info) {
      const target = findFocusTarget(info);
      if (!target) return;
      const disclosure = target.closest('details');
      if (disclosure) disclosure.open = true;
      target.focus();
    }
    function focusSelectedDocument(id) {
      const target = [...document.querySelectorAll('[data-action="select-doc"]')].find(node => node.dataset.docId === id);
      target?.focus();
    }
    function focusDialog(selector) {
      const dialog = document.querySelector(selector);
      const target = dialog?.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      target?.focus();
    }
    function syncOverlayState() {
      const locked = state.detailDrawer.open || state.guided.open || state.diagnosticsOpen || state.staleDialogOpen || state.navDrawerOpen || state.evidenceDrawerOpen || state.review.open;
      document.body.classList.toggle('overlay-open', locked);
    }
    function closeDetailDrawer() {
      if (!state.detailDrawer.open) return;
      dispatch('detail-close');
      render();
      restoreFocus(detailReturnFocus);
      detailReturnFocus = null;
    }
    function closeGuidedModal() {
      if (!state.guided.open) return;
      dispatch('guided-close');
      render();
      restoreFocus(guidedReturnFocus);
      guidedReturnFocus = null;
    }
    function closeDiagnosticsModal() {
      if (!state.diagnosticsOpen) return;
      dispatch('diagnostics-close');
      render();
      restoreFocus(diagnosticsReturnFocus);
      diagnosticsReturnFocus = null;
    }
    function closeStaleDialog() {
      if (!state.staleDialogOpen) return;
      dispatch('stale-cancel');
      render();
      if (staleReturnFocus) restoreFocus(staleReturnFocus);
      else if (state.guided.open) focusDialog('.guided-dialog');
      staleReturnFocus = null;
    }
    function closeNavDrawer() {
      if (!state.navDrawerOpen) return;
      dispatch('nav-close');
      render();
      restoreFocus(navReturnFocus);
      navReturnFocus = null;
    }
    function closeEvidenceDrawer() {
      if (!state.evidenceDrawerOpen) return;
      dispatch('evidence-close');
      render();
      restoreFocus(evidenceReturnFocus);
      evidenceReturnFocus = null;
    }
    function trapDialogFocus(event, selector) {
      const dialog = document.querySelector(selector);
      const focusable = [...(dialog?.querySelectorAll('button, select, textarea, input, [href], [tabindex]:not([tabindex="-1"])') || [])]
        .filter(node => !node.disabled && node.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    function closeReview() {
      state.review.open = false;
      render();
      restoreFocus(reviewReturnFocus);
      reviewReturnFocus = null;
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'toggle-tree') {
        const key = button.dataset.treeKey;
        const inNavDrawer = Boolean(button.closest('#nav-drawer'));
        const result = dispatch('toggle-tree', { key });
        render();
        const scope = inNavDrawer ? document.querySelector('#nav-drawer') : document.querySelector('.nav-panel');
        const target = [...(scope?.querySelectorAll('[data-action="toggle-tree"]') || [])].find(node => node.dataset.treeKey === key);
        target?.focus();
        if (!result.ok || result.message) showToast(result.message, !result.ok);
        return;
      }
      if (action === 'select-doc') {
        const fromNav = state.navDrawerOpen;
        const fromEvidence = state.evidenceDrawerOpen;
        const result = dispatch('select-doc', { id: button.dataset.docId });
        render();
        if (fromNav) { restoreFocus(navReturnFocus); navReturnFocus = null; }
        else if (fromEvidence) { restoreFocus(evidenceReturnFocus); evidenceReturnFocus = null; }
        else focusSelectedDocument(button.dataset.docId);
        showToast(result.message, !result.ok); return;
      }
      if (action === 'item-tab') {
        if (button.dataset.tab === 'overview' && state.detailDrawer.open) { closeDetailDrawer(); return; }
        if (button.dataset.tab !== 'overview') detailReturnFocus = state.evidenceDrawerOpen ? { id: 'mobile-evidence-open' } : describeFocus(button);
        const result = dispatch('item-tab', { tab: button.dataset.tab });
        render();
        if (button.dataset.tab !== 'overview' && result.ok) focusDialog('#detail-drawer');
        showToast(result.message, !result.ok); return;
      }
      if (action === 'detail-close') { closeDetailDrawer(); return; }
      if (action === 'nav-open') {
        navReturnFocus = describeFocus(button);
        dispatch('nav-open'); render(); focusDialog('#nav-drawer'); return;
      }
      if (action === 'nav-close') { closeNavDrawer(); return; }
      if (action === 'evidence-open') {
        evidenceReturnFocus = describeFocus(button);
        dispatch('evidence-open'); render(); focusDialog('#evidence-drawer'); return;
      }
      if (action === 'evidence-close') { closeEvidenceDrawer(); return; }
      if (action === 'guided-open') {
        guidedReturnFocus = describeFocus(button);
        dispatch('guided-open'); render(); focusDialog('.guided-dialog'); return;
      }
      if (action === 'guided-close') {
        closeGuidedModal(); return;
      }
      if (action === 'diagnostics-open') {
        diagnosticsReturnFocus = describeFocus(button);
        dispatch('diagnostics-open'); render(); focusDialog('.diagnostics-dialog'); return;
      }
      if (action === 'diagnostics-close') {
        closeDiagnosticsModal(); return;
      }
      if (action === 'stale-open') {
        staleReturnFocus = describeFocus(button);
        const result = dispatch('stale-open');
        render();
        if (result.ok) focusDialog('.stale-dialog');
        else showToast(result.message, true);
        return;
      }
      if (action === 'stale-cancel' || action === 'stale-close') {
        closeStaleDialog(); return;
      }
      if (action === 'stale-get-latest' || action === 'stale-keep-local') {
        const result = dispatch(action);
        render();
        if (staleReturnFocus) restoreFocus(staleReturnFocus);
        else if (state.guided.open) focusDialog('.guided-dialog');
        staleReturnFocus = null;
        showToast(result.message, !result.ok);
        return;
      }
      if (action === 'guided-select') {
        const result = dispatch('guided-select', { scenario: button.dataset.scenario }); render(); focusDialog('.guided-dialog'); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-reset') {
        const result = dispatch('guided-reset'); render(); focusDialog('.guided-dialog'); showToast(result.message, !result.ok); return;
      }
      if (action === 'guided-next') return runGuidedNext();
      if (action === 'open-review') {
        const active = document.activeElement;
        reviewReturnFocus = describeFocus(active);
        state.detailDrawer.open = false;
        state.guided.open = false;
        state.diagnosticsOpen = false;
        state.staleDialogOpen = false;
        state.navDrawerOpen = false;
        state.evidenceDrawerOpen = false;
        state.review.open = true; render(); focusReview(); return;
      }
      if (action === 'close-review') { closeReview(); return; }
      if (action === 'save-review') { const result = dispatch('save-review', reviewPayload()); render(); focusReview(); showToast(result.message, !result.ok); return; }
      if (action === 'print-review') { window.print(); return; }
      if (action === 'copy-review') { copyReview(); return; }
      if (action === 'reset') { const result = dispatch('reset'); render(); showToast(result.message, !result.ok); return; }
      if (button.getAttribute('aria-disabled') === 'true') {
        const disabledFocus = describeFocus(button);
        const disabledResult = dispatch(action);
        if (action === 'check-in' && activeDoc().conflict) {
          staleReturnFocus = disabledFocus;
          dispatch('stale-open');
        }
        render();
        if (state.staleDialogOpen) focusDialog('.stale-dialog');
        else if (disabledResult.message) showToast(disabledResult.message, true);
        return;
      }
      const result = dispatch(action);
      render();
      if (state.staleDialogOpen) focusDialog('.stale-dialog');
      if (result.message && result.ok) showToast(result.message, false);
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'localeSelect') { state.locale = event.target.value; render(); return; }
      if (event.target.id === 'actorSelect') { const result = dispatch('switch-actor', { actorId: event.target.value }); render(); showToast(result.message, !result.ok); }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'reasonInput') state.draftReason = event.target.value;
      if (event.target.id === 'reviewNotes') state.review.notes = event.target.value;
      if (event.target.id === 'reviewQuestions') state.review.questions = event.target.value;
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (state.staleDialogOpen) { closeStaleDialog(); return; }
        if (state.review.open) { closeReview(); return; }
        if (state.detailDrawer.open) { closeDetailDrawer(); return; }
        if (state.navDrawerOpen) { closeNavDrawer(); return; }
        if (state.evidenceDrawerOpen) { closeEvidenceDrawer(); return; }
        if (state.guided.open) { closeGuidedModal(); return; }
        if (state.diagnosticsOpen) { closeDiagnosticsModal(); return; }
      }
      const dialogSelector = state.staleDialogOpen ? '.stale-dialog'
        : state.review.open ? '.review-dialog'
        : state.detailDrawer.open ? '#detail-drawer'
        : state.navDrawerOpen ? '#nav-drawer'
        : state.evidenceDrawerOpen ? '#evidence-drawer'
        : state.guided.open ? '.guided-dialog'
        : state.diagnosticsOpen ? '.diagnostics-dialog' : '';
      if (event.key === 'Tab' && dialogSelector) {
        trapDialogFocus(event, dialogSelector);
        return;
      }
      const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || event.target?.isContentEditable) return;
    });
    render();
  </script>
</body>
</html>
