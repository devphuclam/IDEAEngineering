spring.datasource.url=jdbc:postgresql://${IDEA_DATABASE_HOST:127.0.0.1}:${IDEA_DATABASE_PORT:5432}/${IDEA_DATABASE_NAME:idea_ddm_dev}
spring.datasource.username=${IDEA_DATABASE_APP_USER:idea_ddm_app}
spring.datasource.password=${IDEA_DATABASE_APP_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# Schema changes are an explicit preflight operation under the separate migration role.
spring.flyway.enabled=false
