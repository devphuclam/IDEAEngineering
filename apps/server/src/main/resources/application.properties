spring.datasource.url=jdbc:postgresql://${IDEA_DATABASE_HOST:127.0.0.1}:${IDEA_DATABASE_PORT:5432}/${IDEA_DATABASE_NAME:idea_ddm_dev}?currentSchema=${IDEA_DATABASE_SCHEMA:public}
spring.datasource.username=${IDEA_DATABASE_APP_USER:idea_ddm_app}
spring.datasource.password=${IDEA_DATABASE_APP_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# Schema changes are an explicit preflight operation under the separate migration role.
spring.flyway.enabled=false

# Normal client boundary is same-origin HTTPS. Only the isolated loopback test overrides Secure.
# Container retention must not pre-empt IDEA's PostgreSQL-enforced 2h idle / 8h absolute policy.
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=IDEA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# T043 HTTPS is an explicit environment prerequisite; no key material is stored in the repo.
server.ssl.enabled=${IDEA_SERVER_TLS_ENABLED:false}
server.ssl.key-store=${IDEA_SERVER_TLS_KEY_STORE:}
server.ssl.key-store-password=${IDEA_SERVER_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${IDEA_SERVER_TLS_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${IDEA_SERVER_TLS_KEY_ALIAS:}

# Internal development console only. It shares the ordinary session/CSRF boundary.
idea.dev-api.enabled=${IDEA_DEV_API_ENABLED:false}
