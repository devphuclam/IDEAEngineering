<svg id="diagram23" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: none; width: 1655.16px;" viewBox="0 0 1655.15625 322.331298828125" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-diagram23" aria-labelledby="chart-title-diagram23"><title id="chart-title-diagram23">Artifact storage evolution boundary</title><desc id="chart-desc-diagram23">Artifact Custody identifies Artifacts by stable identity and digest and calls one storage interface. Controlled Product Data retains only Artifact References in Generation manifests. A filesystem adapter is the current candidate; later object or multi-volume adapters can replace it. Migration copies and verifies bytes before changing custody location records, without changing Generations or Releases.</desc><style>#diagram23{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram23 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram23 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram23 .error-icon{fill:#552222;}#diagram23 .error-text{fill:#552222;stroke:#552222;}#diagram23 .edge-thickness-normal{stroke-width:1px;}#diagram23 .edge-thickness-thick{stroke-width:3.5px;}#diagram23 .edge-pattern-solid{stroke-dasharray:0;}#diagram23 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram23 .edge-pattern-dashed{stroke-dasharray:3;}#diagram23 .edge-pattern-dotted{stroke-dasharray:2;}#diagram23 .marker{fill:#666;stroke:#666;}#diagram23 .marker.cross{stroke:#666;}#diagram23 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#diagram23 p{margin:0;}#diagram23 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#000000;}#diagram23 .cluster-label text{fill:#333;}#diagram23 .cluster-label span{color:#333;}#diagram23 .cluster-label span p{background-color:transparent;}#diagram23 .label text,#diagram23 span{fill:#000000;color:#000000;}#diagram23 .node rect,#diagram23 .node circle,#diagram23 .node ellipse,#diagram23 .node polygon,#diagram23 .node path{fill:#eee;stroke:#999;stroke-width:1px;}#diagram23 .rough-node .label text,#diagram23 .node .label text,#diagram23 .image-shape .label,#diagram23 .icon-shape .label{text-anchor:middle;}#diagram23 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram23 .rough-node .label,#diagram23 .node .label,#diagram23 .image-shape .label,#diagram23 .icon-shape .label{text-align:center;}#diagram23 .node.clickable{cursor:pointer;}#diagram23 .root .anchor path{fill:#666!important;stroke-width:0;stroke:#666;}#diagram23 .arrowheadPath{fill:#333333;}#diagram23 .edgePath .path{stroke:#666;stroke-width:2.0px;}#diagram23 .flowchart-link{stroke:#666;fill:none;}#diagram23 .edgeLabel{background-color:white;text-align:center;}#diagram23 .edgeLabel p{background-color:white;}#diagram23 .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#diagram23 .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram23 .cluster rect{fill:hsl(0, 0%, 98.9215686275%);stroke:#707070;stroke-width:1px;}#diagram23 .cluster text{fill:#333;}#diagram23 .cluster span{color:#333;}#diagram23 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#diagram23 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#000000;}#diagram23 rect.text{fill:none;stroke-width:0;}#diagram23 .icon-shape,#diagram23 .image-shape{background-color:white;text-align:center;}#diagram23 .icon-shape p,#diagram23 .image-shape p{background-color:white;padding:2px;}#diagram23