name: API Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synchronization:
    name: API contract synchronization
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require approved pre-existing Node (no install/download)
        shell: pwsh
        env:
          APPROVED_NODE_PATH: ${{ vars.IDEA_CONTRACT_NODE_PATH }}
        run: |
          $contractNode = if ($env:APPROVED_NODE_PATH) { $env:APPROVED_NODE_PATH } else { (Get-Command node -ErrorAction Stop).Source }
          if ((& $contractNode --version) -ne 'v24.19.0') { throw 'Approved Node 24.19.0 unavailable; provisioning/intake is a separate action.' }
          if ((Get-FileHash -LiteralPath $contractNode -Algorithm SHA256).Hash -ne '3602F2BB1A10F2CBAB4C36886218A33C1AB3DB87290E73B033C46C77147D0237') { throw 'Approved Node binary hash mismatch.' }
          "IDEA_CONTRACT_NODE=$contractNode" >> $env:GITHUB_ENV
      - name: Read-only contract check
        shell: pwsh
        run: |
          & $env:IDEA_CONTRACT_NODE tools/contract-exporter/export.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contract guard regression (built-ins only)
        shell: pwsh
        run: |
          & $env:IDEA_CONTRACT_NODE --test tools/contract-exporter/contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
