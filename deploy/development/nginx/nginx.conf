daemon off;
master_process on;
worker_processes 1;
pid nginx.pid;
error_log logs/nginx-private.log error;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;

    # Do not trust client-supplied Host/Origin or proxy identity headers.
    map $http_host $known_host {
        default 0;
        localhost:18448 1;
        127.0.0.1:18448 1;
    }
    map "$http_host|$http_origin" $same_origin {
        default 0;
        "localhost:18448|" 1;
        "127.0.0.1:18448|" 1;
        "localhost:18448|https://localhost:18448" 1;
        "127.0.0.1:18448|https://127.0.0.1:18448" 1;
    }

    server {
        listen 127.0.0.1:18448 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /home/phuclam/idea-nginx-dev-20261008-49/tls/certificate.pem;
        ssl_certificate_key /home/phuclam/idea-nginx-dev-20261008-49/tls/key.encrypted.pem;
        ssl_password_file /home/phuclam/idea-iam-ui-20261007-46/tls-01/password.private;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        if ($known_host = 0) { return 400; }
        if ($same_origin = 0) { return 403; }

        location / {
            proxy_pass https://127.0.0.1:18449;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 18448;

            # Verify both upstream trust and endpoint identity, not only browser TLS.
            proxy_ssl_trusted_certificate /home/phuclam/idea-nginx-dev-20261008-49/tls/certificate.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 1;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
